<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kẹo Nhà Máy — Isometric Prototype</title>
<style>
  :root{
    --cream:#f6ecd6; --cream2:#efdfc1; --mint:#9fd8c6; --coral:#f2907c;
    --brown:#3b2a24; --brown2:#6b5648; --slate:#4a5b66; --charcoal:#2f3b44;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#221c1a;font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;align-items:center;overflow:hidden}
  #app{position:relative;width:min(440px,100vw);aspect-ratio:440/820;max-height:100vh;max-height:100dvh;background:var(--cream);border-radius:24px;overflow:hidden;
       box-shadow:0 24px 60px rgba(0,0,0,.45);user-select:none}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block}

  .hdr{position:absolute;inset:10px 12px auto 12px;display:flex;gap:7px;align-items:center;z-index:6}
  .lvl{background:var(--brown);color:#ffeccb;border-radius:13px;padding:5px 11px 4px;font-size:10px;font-weight:700;letter-spacing:.6px;
       box-shadow:0 3px 0 #241813, inset 0 1px 0 rgba(255,255,255,.16);line-height:1.15;text-align:center}
  .lvl b{display:block;font-size:16px}
  .progress{flex:1;height:15px;background:#e2cfab;border:2px solid var(--brown);border-radius:9px;overflow:hidden;position:relative}
  .progress i{position:absolute;top:1px;bottom:1px;left:1px;width:42%;border-radius:7px;background:linear-gradient(90deg,var(--mint),#79c6ae);transition:width .12s linear}

  .tag{position:absolute;z-index:5;font-size:11px;font-weight:700;letter-spacing:1.1px;color:#4a3a30;
       background:rgba(255,249,236,.9);border:1.5px solid rgba(59,42,36,.35);border-radius:8px;padding:2px 9px;pointer-events:none;white-space:nowrap}
  .tag.belt{top:116px;left:50%;transform:translateX(-50%)}
  .tag.queue{top:340px;left:50%;transform:translateX(-50%)}
  .tag.queue b{color:#b4593f;letter-spacing:.5px;margin-left:4px}
  .tag.orders{top:470px;left:50%;transform:translateX(-50%)}

  button{font:inherit;cursor:pointer;border:2px solid var(--brown);color:var(--brown);background:var(--cream2);
         box-shadow:0 3px 0 rgba(59,42,36,.42);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,36,.42)}
  button:focus-visible{outline:3px solid #2f7fbe;outline-offset:2px}
  button:disabled{cursor:default}
  .sq{width:40px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;line-height:1;letter-spacing:.4px}
  .sq.off{background:#e4d3b2;opacity:.75}
  .toolbar{position:absolute;right:11px;top:150px;display:flex;flex-direction:column;gap:8px;z-index:6}
  .reset{width:40px;height:40px;border-radius:12px;background:var(--coral);color:#4a231b;border-color:#7d3b2c;display:grid;place-items:center;box-shadow:0 3px 0 #a9503d}
  .reset:active{box-shadow:0 1px 0 #a9503d}

  .boosters{position:absolute;left:10px;right:10px;bottom:28px;display:flex;gap:6px;z-index:6}
  .boosters button{flex:1 1 0;min-width:0;height:40px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
                   gap:1px;padding:0 1px;font-weight:800;font-size:9px;line-height:1.05;letter-spacing:.2px}
  .boosters .ico{font-size:13px;line-height:1}
  .boosters button:nth-child(1){background:var(--mint)}
  .boosters button:nth-child(2){background:#ffd9a0}
  .boosters button:nth-child(3){background:var(--coral)}
  .boosters button:nth-child(4){background:#cfd9e6}

  .cap{position:absolute;left:12px;right:12px;bottom:6px;text-align:center;font-size:9px;line-height:1.25;color:#8a7060;z-index:5;pointer-events:none;margin:0}
  .cap b{color:#6b5040}
</style>
</head>
<body>
<div id="app">
  <svg id="scene" viewBox="0 0 440 820" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Bản xem trước gameplay isometric: băng chuyền, hàng chờ và sáu thùng hàng"></svg>

  <header class="hdr">
    <div class="lvl">LEVEL<b>12</b></div>
    <div class="progress" id="progress" role="progressbar" aria-label="Tiến độ màn" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42"><i id="bar"></i></div>
  </header>

  <div class="tag belt">BĂNG CHUYỀN</div>
  <div class="tag queue" aria-live="polite">HÀNG CHỜ<b id="queueCount">0/5</b></div>
  <div class="tag orders">KHÁCH ĐẶT</div>

  <div class="toolbar">
    <button class="sq" id="angleBtn" type="button" aria-pressed="true" title="Đổi góc nhìn isometric">ISO</button>
    <button class="sq" id="pauseBtn" type="button" aria-pressed="false" title="Tạm dừng / tiếp tục" aria-label="Tạm dừng">II</button>
    <button class="reset" id="resetBtn" type="button" title="Chơi lại màn" aria-label="Chơi lại màn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.4h-4.4"/>
      </svg>
    </button>
  </div>

  <div class="boosters">
    <button type="button" aria-label="Tăng tốc băng chuyền, còn 3 lượt"><span class="ico" aria-hidden="true">»</span>TỐC ĐỘ ×3</button>
    <button type="button" aria-label="Đóng băng băng chuyền, còn 2 lượt"><span class="ico" aria-hidden="true">❄</span>ĐÓNG BĂNG ×2</button>
    <button type="button" aria-label="Nhân đôi thùng hàng, còn 1 lượt"><span class="ico" aria-hidden="true">✦</span>NHÂN ĐÔI ×1</button>
    <button type="button" aria-label="Kẹp tự động, còn 4 lượt"><span class="ico" aria-hidden="true">◎</span>TỰ KẸP ×4</button>
  </div>

  <p class="cap"><b>Chỉ là prototype hình ảnh</b> — minh hoạ góc nhìn isometric cho gameplay kẹo/bánh. Không sửa game thật.</p>
</div>

<script>
(() => {
"use strict";
const NS  = "http://www.w3.org/2000/svg";
const svg = document.getElementById("scene");
const bar = document.getElementById("bar");
const progressEl = document.getElementById("progress");
const queueCount = document.getElementById("queueCount");

const C = {
  ink:"#3b2a24", ink2:"#6b5648",
  cream:"#f6ecd6", cream2:"#efdfc1", cream3:"#fbf5e6", hole:"#fdf8ea",
  mint:"#9fd8c6", mintD:"#5fb59a", mintL:"#cdeee3",
  coral:"#f2907c", coralD:"#d1604a", coralL:"#fbc4b7",
  slate:"#4a5b66", slateL:"#6a7d89", charcoal:"#2f3b44", band:"#36434d",
  steel:"#cfc9bd",
  card:"#e9d5b0", cardL:"#f4e3c4", cardD:"#cdb18a", cardF:"#dcc6a0",
  wood:"#f3e7cf", woodD:"#d6c0a0", woodF:"#c9b18e",
  dark:"#c2a67e", darkL:"#d3b994",
  pink:"#f7c9e0", pinkD:"#d694b6",
  lampOn:"#7be3c0", lampOff:"#b9b1a4"
};

/* ---------------- helpers ---------------- */
function el(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function poly(pts, fill, stroke, w, parent, extra){
  return el("polygon", Object.assign({
    points: pts.map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" "),
    fill, stroke: stroke === undefined ? C.ink : stroke,
    "stroke-width": w == null ? 1.5 : w, "stroke-linejoin":"round"
  }, extra || {}), parent);
}
function seg2(a, b, color, w, parent){
  return el("line",{x1:a[0].toFixed(2),y1:a[1].toFixed(2),x2:b[0].toFixed(2),y2:b[1].toFixed(2),
    stroke:color,"stroke-width":w,"stroke-linecap":"round"}, parent);
}

/* ---------------- projection ----------------
   One isometric basis for every area. Each area keeps its OWN world origin
   (a screen anchor), so translating an anchor shifts the whole group vertically
   without changing the angle or distorting depth. */
const KX = 0.62, KY = 0.30;
let sy = KY;      // current tilt (angle toggle)
let zf = 1;       // height squash in the flatter view

const AREA = {
  belt:   {x:222, y:250},   // ring top-centre
  queue:  {x:222, y:404},   // five docks
  orders: {x:222, y:606}    // six cartons (far-row centre)
};
const mkP = o => (x, y, z = 0) => [o.x + (x - y) * KX, o.y + (x + y) * sy - z * zf];
const PB = mkP(AREA.belt), PQ = mkP(AREA.queue), PO = mkP(AREA.orders);

/* extruded box: rect (x,y,w,d) from zLo..zHi */
function box(g, P, x, y, w, d, zLo, zHi, top, left, right, sw){
  poly([P(x,y+d,zHi),P(x+w,y+d,zHi),P(x+w,y+d,zLo),P(x,y+d,zLo)], right, C.ink, sw, g); // front (+y)
  poly([P(x+w,y,zHi),P(x+w,y+d,zHi),P(x+w,y+d,zLo),P(x+w,y,zLo)], left,  C.ink, sw, g); // right (+x)
  poly([P(x,y,zHi),P(x+w,y,zHi),P(x+w,y+d,zHi),P(x,y+d,zHi)], top, C.ink, sw, g);
}

/* ---------------- layers ---------------- */
const gFloor = el("g",{},svg);
const gHole  = el("g",{},svg);   // cream hole + inner wall (painted first)
const gBand  = el("g",{},svg);   // charcoal running band + cleats
const gBody  = el("g",{},svg);   // slate ring top, rails, fascia
const gDocks = el("g",{},svg);
const gHold  = el("g",{},svg);   // held tray (drawn above the band)
const gArms  = el("g",{},svg);
const gCart  = el("g",{},svg);
const gFx    = el("g",{},svg);

/* ================================================================
   CONVEYOR RING
   ================================================================ */
const RING = {x0:-186, x1:186, y0:-112, y1:112, r:40, i:52, z:34, zBot:0};

/* rounded-rect path in screen space; corner controls lie on the projected tangents */
function rrPath(P, inset, z){
  const {x0,x1,y0,y1,r} = RING;
  const ax=x0+inset, bx=x1-inset, ay=y0+inset, by=y1-inset, rad=Math.max(3, r-inset);
  const A=P(ax+rad,ay,z), B=P(bx-rad,ay,z), Cn=P(bx,ay+rad,z), D=P(bx,by-rad,z),
        E=P(bx-rad,by,z), F=P(ax+rad,by,z), G=P(ax,by-rad,z), H=P(ax,ay+rad,z);
  const unit = v => { const m = Math.hypot(v[0],v[1]) || 1; return [v[0]/m, v[1]/m]; };
  const ctl = (p,u,q)=>{ const a=unit(u), L=Math.hypot(q[0]-p[0],q[1]-p[1])*0.55; return [p[0]+a[0]*L, p[1]+a[1]*L]; };
  const tanTop = [B[0]-A[0], B[1]-A[1]], tanRight = [D[0]-Cn[0], D[1]-Cn[1]],
        tanBot = [F[0]-E[0], F[1]-E[1]], tanLeft = [H[0]-G[0], H[1]-G[1]];
  const c1 = ctl(B,tanTop,Cn), c2 = ctl(D,tanRight,E), c3 = ctl(F,tanBot,G), c4 = ctl(H,tanLeft,A);
  return `M${A} L${B} Q${c1[0]},${c1[1]} ${Cn} L${D} Q${c2[0]},${c2[1]} ${E} ` +
         `L${F} Q${c3[0]},${c3[1]} ${G} L${H} Q${c4[0]},${c4[1]} ${A} Z`;
}

/* sample the band centreline in world space; screen path is clockwise */
const CTL = (()=>{
  const {x0,x1,y0,y1,r,i} = RING;
  const ax=x0+i, bx=x1-i, ay=y0+i, by=y1-i, rad=Math.max(3,r-i);
  const w = [];
  const edge=(u0,v0,u1,v1,n)=>{ for(let k=0;k<n;k++) w.push([u0+(u1-u0)*k/n, v0+(v1-v0)*k/n]); };
  const arc=(cu,cv,a0,a1,n)=>{ for(let k=0;k<n;k++){ const a=a0+(a1-a0)*k/n; w.push([cu+Math.cos(a)*rad, cv+Math.sin(a)*rad]); } };
  edge(ax+rad, ay, bx-rad, ay, 12);             // top, L->R
  arc(bx-rad, ay+rad, -Math.PI/2, 0, 5);        // top-right
  edge(bx, ay+rad, bx, by-rad, 8);              // right, top->bottom
  arc(bx-rad, by-rad, 0, Math.PI/2, 5);         // bottom-right
  edge(bx-rad, by, ax+rad, by, 12);             // bottom, R->L
  arc(ax+rad, by-rad, Math.PI/2, Math.PI, 5);   // bottom-left
  edge(ax, by-rad, ax, ay+rad, 8);              // left, bottom->top
  arc(ax+rad, ay+rad, Math.PI, Math.PI*1.5, 5); // top-left
  // resample for smooth tangents
  const world = [];
  for (let n=0;n<w.length;n++){
    const a=w[n], b=w[(n+1)%w.length];
    for (let k=0;k<5;k++) world.push([a[0]+(b[0]-a[0])*k/5, a[1]+(b[1]-a[1])*k/5]);
  }
  const sc = world.map(([u,v])=>PB(u,v,RING.z));
  return {world, sc};
})();
function ringAt(t){
  const N = CTL.sc.length;
  const f = (((t % 1) + 1) % 1) * N;
  const n = Math.floor(f) % N, m = (n + 2) % N, p = (n - 2 + N) % N;
  return {pos: CTL.sc[n], world: CTL.world[n],
          dir: [CTL.sc[m][0]-CTL.sc[p][0], CTL.sc[m][1]-CTL.sc[p][1]]};
}

function drawBeltStatic(){
  const z = RING.z, zb = RING.zBot;
  const outer = rrPath(PB, 0, z), inner = rrPath(PB, RING.i, z);
  const fasciaH = (z - zb) * zf;

  // ground shadow
  el("path",{d:outer, fill:"none", stroke:"rgba(59,42,36,.13)","stroke-width":14,
    transform:`translate(3,${(fasciaH*0.75).toFixed(1)})`},gFloor);

  // 1. slate ring top (annulus), painted on the body layer
  el("path",{d:`${outer} ${inner}`, fill:C.slate, "fill-rule":"evenodd", stroke:C.ink,"stroke-width":1.6,"stroke-linejoin":"round"},gBody);

  // 2. inside of the hole: inner wall faces stepping down, then the big cream floor
  el("path",{d:rrPath(PB, RING.i + 3, zb + 2), fill:"#ded0b0", stroke:"none"},gHole);
  for (let k=1;k<=4;k++){
    const d = (fasciaH * k/5).toFixed(1);
    el("path",{d:inner, fill:"none", stroke:(k<3 ? "#c9b692" : "#d8c8a6"), "stroke-width":(fasciaH/4.4).toFixed(1),
      transform:`translate(0,${d})`},gHole);
  }
  el("path",{d:inner, fill:C.hole, stroke:C.ink,"stroke-width":2,"stroke-linejoin":"round"},gHole);
  el("path",{d:inner, fill:"none", stroke:"rgba(255,255,255,.75)","stroke-width":1.3, transform:"translate(0,-1.3)"},gHole);

  // 3. charcoal running band on top of the slate ring, inset 4 inside both edges
  el("path",{d:`${rrPath(PB,4,z+1)} ${rrPath(PB,RING.i-4,z+1)}`, fill:C.band,
    "fill-rule":"evenodd", stroke:C.charcoal,"stroke-width":1.2,"stroke-linejoin":"round"},gBand);

  // 4. thick front fascia, drawn as the outer silhouette repeated downwards
  for (let k=0;k<6;k++){
    const d = (fasciaH * (k/6)).toFixed(1);
    el("path",{d:outer, fill:"none", stroke: k===0 ? C.slateL : C.slate, "stroke-width":(fasciaH*0.62).toFixed(1),
      "stroke-linejoin":"round", transform:`translate(0,${d})`},gBody);
  }
  el("path",{d:outer, fill:"none", stroke:C.ink,"stroke-width":1.8,"stroke-linejoin":"round"},gBody);
  // fascia rivets
  [-96, 0, 96].forEach(x=>{
    const p = PB(x, RING.y1, 0);
    el("circle",{cx:p[0],cy:p[1]+fasciaH*0.45,r:4.6,fill:C.steel,stroke:C.ink,"stroke-width":1.4},gBody);
    el("circle",{cx:p[0],cy:p[1]+fasciaH*0.45,r:1.6,fill:C.ink2},gBody);
  });
  // side motor block on the left end
  const mp = PB(RING.x0+6, 0, 0);
  el("rect",{x:mp[0]-8,y:mp[1]+fasciaH*0.3-12,width:16,height:24,rx:6,fill:C.coral,stroke:C.ink,"stroke-width":1.5},gBody);
  // cream kerb rails on both long sides
  [[RING.y0+3.5,0],[RING.y1-3.5,0]].forEach(([yy])=>{
    seg2(PB(RING.x0+26,yy,z+4), PB(RING.x1-26,yy,z+4), C.ink, 7, gBand);
    seg2(PB(RING.x0+26,yy,z+4), PB(RING.x1-26,yy,z+4), C.cream3, 5, gBand);
  });
}

function drawCleats(phase){
  for (const n of gBand.querySelectorAll(".cleat")) n.remove();
  const N = CTL.sc.length, step = 11;
  for (let k=0;k<N;k+=step){
    const r = ringAt(k/N + phase);
    const [x, y] = r.pos;
    const d = Math.hypot(r.dir[0], r.dir[1]) || 1;
    const ux = r.dir[0]/d, uy = r.dir[1]/d;
    const nx = -uy, ny = ux;
    const cx = x - ux*2, cy = y - uy*2 - 1;
    const a = [cx-nx*7, cy-ny*7], b = [cx+nx*7, cy+ny*7];
    seg2(a, b, "rgba(0,0,0,.35)", 5.2, gBand);
    seg2([a[0]-ux*1.6,a[1]-uy*1.6], [b[0]-ux*1.6,b[1]-uy*1.6], "#93a4ae", 3.4, gBand);
  }
}

/* ================================================================
   GOODS — large, mint + coral
   ================================================================ */
function drawGood(g, P, x, y, z, kind, S){
  S = S || 1.5;
  const t = P(x, y, z);
  el("ellipse",{cx:t[0],cy:t[1]+1,rx:7*S,ry:3.2*S,fill:"rgba(59,42,36,.15)"},g);
  if (kind === 0){                       // wrapped candy
    seg2(P(x-10*S,y,z+0.5), P(x+10*S,y,z+0.5), "#fffaf0", 7*S, g);
    const r = 7.4*S;
    el("circle",{cx:t[0],cy:t[1],r,fill:C.coral,stroke:C.ink,"stroke-width":1.5},g);
    el("path",{d:`M${t[0]-r},${t[1]} A${r},${r*0.94} 0 0 1 ${t[0]+r},${t[1]} L${t[0]-r},${t[1]} Z`, fill:C.coralD, stroke:C.ink,"stroke-width":1.3},g);
    el("path",{d:`M${t[0]-r},${t[1]} A${r},${r*0.94} 0 0 0 ${t[0]+r},${t[1]} L${t[0]-r},${t[1]} Z`, fill:C.mint, stroke:C.ink,"stroke-width":1.3},g);
    el("circle",{cx:t[0]-2.6*S,cy:t[1]-2.8*S,r:2.1,fill:"rgba(255,255,255,.88)"},g);
  } else if (kind === 1){                // mint cookie with coral chips
    const r = 8.6*S;
    el("circle",{cx:t[0],cy:t[1],r,fill:C.mint,stroke:C.ink,"stroke-width":1.5},g);
    el("path",{d:`M${t[0]-r},${t[1]} A${r},${r*0.9} 0 0 0 ${t[0]+r},${t[1]} Z`, fill:C.mintD, stroke:"none"},g);
    [[-3,-2.4],[2.6,-3.2],[0,2.6],[-2.4,2.0],[3.4,1.2]].forEach(([a,b])=>
      el("circle",{cx:t[0]+a*S,cy:t[1]+b*S,r:1.8,fill:C.coralD},g));
    el("circle",{cx:t[0]-3.2*S,cy:t[1]-3.4*S,r:2.1,fill:"rgba(255,255,255,.75)"},g);
  } else if (kind === 2){                // lollypop
    const top = P(x, y, z+17*S);
    seg2(t, [t[0], t[1]-1], C.ink, 4, g);
    seg2(t, [t[0], t[1]-1], "#f2e7d2", 2.4, g);
    const r = 7.4*S;
    el("circle",{cx:top[0],cy:top[1],r,fill:C.coral,stroke:C.ink,"stroke-width":1.5},g);
    el("path",{d:`M${top[0]-r},${top[1]} A${r},${r*0.94} 0 0 1 ${top[0]+r},${top[1]} L${top[0]-r},${top[1]} Z`, fill:C.mint, stroke:C.ink,"stroke-width":1.2},g);
    el("circle",{cx:top[0]-2.4*S,cy:top[1]-2.6*S,r:1.8,fill:"rgba(255,255,255,.85)"},g);
  } else {                               // mint square bonbon
    const s = 7.2*S, h = 9*S;
    box(g, P, x-s, y-s, 2*s, 2*s, z, z+h, C.pink, C.pinkD, C.coralL, 1.4);
    const c = P(x, y, z+h);
    el("circle",{cx:c[0],cy:c[1],r:3,fill:C.mintD,stroke:C.ink,"stroke-width":1.1},g);
  }
}

/* ================================================================
   TRAY (held as a whole)
   ================================================================ */
function drawTray(g, P, x, y, z, held){
  const W=72, D=44, H=10;
  const s = P(x, y, z);
  el("ellipse",{cx:s[0],cy:s[1]+3,rx:27,ry:12,fill:"rgba(59,42,36,.14)"},g);
  box(g, P, x-W/2, y-D/2, W, D, z, z+H, C.cream3, "#e8d9ba", "#d9c7a5", 1.5);
  // goods are painted onto the tray — tray + goods move as one rigid piece
  drawGood(g, P, x-17, y-2, z+H, 0, 1.15);
  drawGood(g, P, x+16, y-3, z+H, 1, 1.15);
  drawGood(g, P, x-1, y+11, z+H, 3, 1.05);
  const lp = P(x, y-D/2-3, z+H+3);
  el("circle",{cx:lp[0],cy:lp[1],r:2.8,fill: held ? C.coral : (lampOn ? C.lampOn : C.lampOff),stroke:C.ink,"stroke-width":1},g);
  if (held){
    seg2(P(x-26,y,z+H+3), P(x+26,y,z+H+3), "rgba(59,42,36,.30)", 6, g);
  }
}

/* ================================================================
   CLAWS — compact, at the ring's left/right endpoints
   ================================================================ */
const CLAW_T = {out: 0.035, in: 0.535};
function clawGeom(side, open, lift){
  const r = ringAt(side < 0 ? CLAW_T.out : CLAW_T.in);
  const [sx, syS] = r.pos;
  const headX = sx + side * 14;
  const headY = syS - 54 - lift * 18;
  return {headX, headY, open};
}
function drawClaw(g, side, open, lift, sway){
  const {headX:hx, headY:hy} = clawGeom(side, open, lift);
  const groundY = PB(side < 0 ? -RING.x0 : RING.x1, 0, 0)[1] + 30;

  // pedestal
  el("ellipse",{cx:hx,cy:groundY+8,rx:20,ry:8,fill:"rgba(59,42,36,.13)"},g);
  el("path",{d:`M${hx-16},${groundY+7} L${hx-14},${groundY-13} Q${hx},${groundY-19} ${hx+14},${groundY-13} L${hx+16},${groundY+7} Z`,
    fill:C.slate, stroke:C.ink,"stroke-width":1.6,"stroke-linejoin":"round"},g);
  el("path",{d:`M${hx-14},${groundY-13} Q${hx},${groundY-19} ${hx+14},${groundY-13} l-2,4 Q${hx},${groundY-11} ${hx-12},${groundY-9} Z`,
    fill:C.slateL, stroke:C.ink,"stroke-width":1.1},g);

  // telescopic column
  const colTop = hy + 4, colBot = groundY - 14;
  el("rect",{x:hx-6,y:colTop,width:12,height:Math.max(8,colBot-colTop),rx:3,fill:C.steel,stroke:C.ink,"stroke-width":1.5},g);
  el("rect",{x:hx-3,y:colTop+4,width:4,height:Math.max(6,colBot-colTop-10),rx:2,fill:"rgba(255,255,255,.6)"},g);

  // wrist + head
  el("rect",{x:hx-16,y:hy-12,width:32,height:16,rx:7,fill:C.cream3,stroke:C.ink,"stroke-width":1.6},g);
  el("circle",{cx:hx,cy:hy-4,r:4.4,fill:C.mint,stroke:C.ink,"stroke-width":1.3},g);

  // jaws open toward the belt (inward), never in front of the cartons
  const dir = -side;
  const spread = 5 + open * 9;
  [-1,1].forEach(k=>{
    const x1 = hx + dir*7 + k*spread,        y1 = hy + 1;
    const x2 = hx + dir*11 + k*(spread-2) + sway*(k*2.5), y2 = hy + 24;
    seg2([x1,y1],[x2,y2], C.ink, 6.6, g);
    seg2([x1,y1],[x2,y2], k < 0 ? C.coral : C.mint, 4.2, g);
  });
  el("circle",{cx:hx,cy:hy+1,r:4.8,fill:"#f7d9a8",stroke:C.ink,"stroke-width":1.5},g);

  // hold point: whole tray hangs between the jaws
  return {holdX: hx + dir*8, holdY: hy + 18};
}

/* ================================================================
   DOCKS — five slots behind the ring
   ================================================================ */
const DOCK_X = [-142,-71,0,71,142], DOCK_Y = -RING.y1 - 46;
let filled = [false,false,false,false,false];
function drawDocks(){
  gDocks.innerHTML = "";
  DOCK_X.forEach((x,i)=>{
    const f = filled[i];
    const a=PQ(x-18,DOCK_Y-17,1), b=PQ(x+18,DOCK_Y-17,1), c=PQ(x+18,DOCK_Y+17,1), d=PQ(x-18,DOCK_Y+17,1);
    poly([a,b,c,d], f ? C.mintL : C.wood, "rgba(59,42,36,.28)", 1.3, gDocks);
    box(gDocks, PQ, x-18, DOCK_Y-17, 36, 34, 1, f ? 11 : 7,
        f ? "#c9e8dc" : C.wood, f ? "#a9d1c2" : C.woodD, f ? "#b9dccf" : C.woodF, 1.4);
    const t = PQ(x, DOCK_Y, f ? 12 : 8);
    el("circle",{cx:t[0],cy:t[1],r:3.6,fill: f ? C.mintD : "rgba(59,42,36,.22)",stroke:C.ink,"stroke-width":1},gDocks);
    if (f) drawGood(gDocks, PQ, x, DOCK_Y, 12, i % 4, 0.8);
  });
}

/* ================================================================
   CARTONS — six open boxes, 3 x 2, three big cells each
   ================================================================ */
function drawCarton(g, P, cx, cy, kinds){
  const W = 104, D = 60, H = 34, wallF = 11, wallB = 12, wallS = 8;
  const x0 = cx - W/2, y0 = cy - D/2;

  el("ellipse",{cx:P(cx,cy+4,0)[0], cy:P(cx,cy+4,0)[1]+4, rx:74, ry:24, fill:"rgba(59,42,36,.08)"},g);
  box(g, P, x0, y0, W, D, 0, H, C.card, C.cardF, C.cardD, 1.7);

  // cavity
  const ix0=x0+wallS, ix1=x0+W-wallS, iy0=y0+wallB, iy1=y0+D-wallF;
  poly([P(ix0,iy0,H),P(ix1,iy0,H),P(ix1,iy1,H),P(ix0,iy1,H)], C.dark, C.ink, 1.2, g);

  // three cells with dividers
  const cellW = (ix1 - ix0 - 8) / 3;
  for (let k=0;k<3;k++){
    const ax = ix0 + 4 + k*cellW, bx = ax + cellW;
    const zs = H - 2;
    poly([P(ax+2,iy0,zs),P(bx-2,iy0,zs),P(bx-2,iy1,zs),P(ax+2,iy1,zs)], k%2 ? C.darkL : "#efe0c4", "rgba(59,42,36,.30)", 1, g);
    drawGood(g, P, (ax+bx)/2, cy + 3, zs, kinds[k], 1.7);
    if (k < 2){
      seg2(P(bx, iy0, zs), P(bx, iy1, zs), "rgba(59,42,36,.32)", 1.8, g);
      seg2(P(bx, iy0, H), P(bx, iy0, zs), "rgba(59,42,36,.22)", 1.4, g);
    }
  }

  // back wall — thin strip (max 12px tall) so goods stay visible
  poly([P(ix0,iy0,H),P(ix1,iy0,H),P(ix1,iy0,H-3),P(ix0,iy0,H-3)], "#fff3dd", C.ink, 1.2, g);

  // outward-folded flaps: thin, low, only on the far/near edges
  poly([P(x0,y0,H),P(x0+W,y0,H),P(x0+W,y0-9,H-5),P(x0,y0-9,H-5)], "#e4d1b0", C.ink, 1.4, g);
  poly([P(x0,y0+D,H),P(x0+W,y0+D,H),P(x0+W,y0+D+8,H-5),P(x0,y0+D+8,H-5)], C.cream3, C.ink, 1.4, g);

  // small front label (kept below the goods so nothing is obscured)
  const lb = P(cx, y0+D-wallF*0.42, H-4);
  el("rect",{x:lb[0]-14,y:lb[1]-3.6,width:28,height:7.2,rx:2.2,fill:"rgba(255,255,255,.6)",stroke:"rgba(59,42,36,.32)","stroke-width":1},g);
}

const CARTONS = [
  {cx:-100, cy:-6,  k:[0,1,2]},
  {cx: 100, cy:-6,  k:[3,1,0]},
  {cx:   0, cy:-6,  k:[1,2,3]},
  {cx:-100, cy: 82, k:[2,3,1]},
  {cx: 100, cy: 82, k:[0,2,3]},
  {cx:   0, cy: 82, k:[1,0,2]}
];
function drawCartons(){
  gCart.innerHTML = "";
  CARTONS.forEach(o=>{
    const g = el("g",{},gCart);
    drawCarton(g, PO, o.cx, o.cy, o.k);
  });
}

/* ================================================================
   CLOCK + STATE
   ================================================================ */
const T = 11000;
let clock = 0, paused = false, last = performance.now(), lampOn = true;
let trayOut = 0.035, trayIn = 0.535;
const speed = 0.55;                         // ring laps per loop
const toast = {text:"", life:0};

const clamp = (v,a,b) => v<a?a:v>b?b:v;
const ease = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
const seg = (t,a,b) => clamp((t-a)/(b-a),0,1);

/* timeline (fraction of loop)
   0.00–0.24  LEFT claw descends to its endpoint and grips the tray there
   0.24–0.60  LEFT claw lifts and holds the WHOLE tray (tray + goods move together)
   0.60–0.70  LEFT claw lowers the tray onto the first dock, releases
   0.14–0.30  RIGHT claw receives a tray onto its endpoint
*/
const OUT_HOLD = [0.24, 0.60], IN_HOLD = [0.14, 0.30];

function render(t){
  drawCleats((t * 3.4) % 1);

  const outHeld = t > OUT_HOLD[0] && t < OUT_HOLD[1];
  const inHeld  = t > IN_HOLD[0]  && t < IN_HOLD[1];
  const outLift = t < OUT_HOLD[0] ? ease(seg(t,.20,.24))
                : t < OUT_HOLD[1] ? 1 - ease(seg(t,.56,.60))
                : 0;
  const inLift  = t < IN_HOLD[0] ? 0
                : t < IN_HOLD[1] ? 1 - ease(seg(t,.26,.30))
                : 0;

  gArms.innerHTML = "";
  const hold = drawClaw(gArms, -1, outHeld ? 0 : 1, outLift, outHeld ? 0.6 : 0);
  drawClaw(gArms, 1, inHeld ? 0 : 1, inLift, 0);

  // trays riding the belt (hidden while their claw holds them)
  gHold.innerHTML = "";
  const drawRingTray = (u)=>{
    const r = ringAt(u);
    const g = el("g",{},gHold);
    drawTray(g, PB, r.world[0], r.world[1], RING.z + 2, false);
  };
  if (!outHeld) drawRingTray(trayOut);
  if (!inHeld)  drawRingTray(trayIn);

  // held tray: entire tray is drawn under the jaws, at the claw's hold point
  if (outHeld){
    const P = (x, y, z = 0) => [hold.holdX + (x - y) * KX, hold.holdY + (x + y) * sy + 26 - z * zf];
    const g = el("g",{},gHold);
    drawTray(g, P, 0, 0, 0, true);
  }

  // docks reflect delivered trays (deterministic, derived from clock)
  const delivered = outHeld || t < .70 ? 0 : 1;
  filled = [false,false,false,false,false];
  filled[0] = delivered > 0;
  filled[1] = t > .58;
  filled[3] = t > .82;
  drawDocks();

  // progress + counter
  const prog = 12 + 78 * ((t + .8) % 1);
  bar.style.width = prog.toFixed(1) + "%";
  progressEl.setAttribute("aria-valuenow", prog.toFixed(0));
  queueCount.textContent = filled.filter(Boolean).length + "/5";

  // fx
  gFx.innerHTML = "";
  if (outHeld && t < .30){
    const k = seg(t,.24,.30);
    el("circle",{cx:hold.holdX,cy:hold.holdY,r:10+26*k,fill:"none",stroke:C.mintD,"stroke-width":2.4,opacity:(1-k).toFixed(2)},gFx);
  }
  if (t > .62 && t < .70){
    const k = seg(t,.62,.70);
    const p = PQ(DOCK_X[0], DOCK_Y, 14);
    el("circle",{cx:p[0],cy:p[1],r:8+22*k,fill:"none",stroke:C.coral,"stroke-width":2.4,opacity:(1-k).toFixed(2)},gFx);
  }
  if (toast.life > 0){
    const n = el("text",{x:220,y:648,"text-anchor":"middle","font-size":15,"font-weight":700,fill:"#b4593f",opacity:toast.life.toFixed(2)},gFx);
    n.textContent = toast.text;
  }
}

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(64, now - last); last = now;
  if (!paused){
    clock = (clock + dt) % T;
    trayOut = (trayOut + (dt/T) * speed) % 1;
    trayIn  = (trayIn  + (dt/T) * speed) % 1;
    if (toast.life > 0) toast.life -= dt / 900;
  }
  const t = clock / T;
  lampOn = !(t > OUT_HOLD[0] && t < .30);
  render(t);
}

/* ================================================================
   STATIC BUILD
   ================================================================ */
function drawFloor(){
  gFloor.innerHTML = "";
  const fz = -20;
  poly([PB(-340,-340,fz), PB(340,-340,fz), PB(340,340,fz), PB(-340,340,fz)], "#efe4cc", "none", 0, gFloor);
  for (let i=-4;i<=4;i++) for (let j=-4;j<=4;j++){
    if (((i+j)&1) === 0) continue;
    const x=i*80, y=j*80;
    poly([PB(x,y,0),PB(x+80,y,0),PB(x+80,y+80,0),PB(x,y+80,0)], "rgba(255,255,255,.22)", "none", 0, gFloor);
  }
  [[-300,-210,C.mint],[230,-250,C.coral],[-290,260,C.coral],[240,220,C.mint]].forEach(([x,y,col])=>{
    poly([PB(x,y,0),PB(x+64,y,0),PB(x+64,y+64,0),PB(x,y+64,0)], col, "none", 0, gFloor).setAttribute("opacity",".20");
  });
}

function buildStatic(){
  drawFloor();
  gHole.innerHTML = ""; gBand.innerHTML = ""; gBody.innerHTML = "";
  drawBeltStatic();
  drawCartons();
}

/* ================================================================
   CONTROLS — semantic buttons
   ================================================================ */
const angleBtn = document.getElementById("angleBtn");
const pauseBtn = document.getElementById("pauseBtn");
const resetBtn = document.getElementById("resetBtn");

angleBtn.addEventListener("click", ()=>{
  const iso = sy < 0.24;
  sy = iso ? KY : 0.175;
  zf = iso ? 1 : 0.70;
  angleBtn.textContent = iso ? "ISO" : "FLAT";
  angleBtn.setAttribute("aria-pressed", String(iso));
  angleBtn.classList.toggle("off", !iso);
  buildStatic();
});
pauseBtn.addEventListener("click", ()=>{
  paused = !paused;
  pauseBtn.textContent = paused ? "▶" : "II";
  pauseBtn.classList.toggle("off", paused);
  pauseBtn.setAttribute("aria-pressed", String(paused));
  pauseBtn.setAttribute("aria-label", paused ? "Tiếp tục" : "Tạm dừng");
});
resetBtn.addEventListener("click", ()=>{
  clock = 0; trayOut = CLAW_T.out; trayIn = CLAW_T.in;
  toast.text = "Đã chơi lại màn"; toast.life = 1;
});

document.querySelectorAll(".boosters button").forEach(b=>{
  const label = b.getAttribute("aria-label");
  b.dataset.left = (label.match(/(\d+)\s*lượt/) || [,"0"])[1];
  b.addEventListener("click", ()=>{
    b.dataset.left = String(Math.max(0, parseInt(b.dataset.left,10) - 1));
    // keep the icon span intact — only rewrite the trailing count
    b.lastChild.textContent = b.lastChild.textContent.replace(/×\d+$/, "×" + b.dataset.left);
    b.setAttribute("aria-label", label.replace(/\d+\s*lượt/, b.dataset.left + " lượt"));
    if (b.dataset.left === "0") b.disabled = true;
    toast.text = "Dùng booster"; toast.life = 1;
  });
});

buildStatic();
requestAnimationFrame(frame);
})();
</script>
