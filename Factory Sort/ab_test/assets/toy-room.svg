<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="512" height="910" viewBox="0 0 512 910" preserveAspectRatio="xMidYMin slice">
  <title>Toy factory room backdrop</title>

  <defs>
    <!-- ===================== plaster wall ===================== -->
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFF1FD"/>
      <stop offset="0.26" stop-color="#EBF6FE"/>
      <stop offset="0.60" stop-color="#DCEEFB"/>
      <stop offset="1" stop-color="#C9E1F4"/>
    </linearGradient>

    <radialGradient id="wallGlow" cx="0.5" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#FFF7E4" stop-opacity="0.72"/>
      <stop offset="0.42" stop-color="#F6FCFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F6FCFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ceilCove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- ===================== awning ===================== -->
    <linearGradient id="stripeBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#7CC2F6"/>
      <stop offset="0.28" stop-color="#4F9DE8"/>
      <stop offset="0.72" stop-color="#3079C8"/>
      <stop offset="1"    stop-color="#22589C"/>
    </linearGradient>
    <linearGradient id="stripeIvory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFFAEF"/>
      <stop offset="1"    stop-color="#E9DCC3"/>
    </linearGradient>

    <pattern id="awning" width="64" height="30" patternUnits="userSpaceOnUse">
      <rect x="0"  y="0" width="32" height="16" fill="url(#stripeBlue)"/>
      <rect x="32" y="0" width="32" height="16" fill="url(#stripeIvory)"/>
      <path d="M0,16 A16,14 0 0 0 32,16 Z"  fill="url(#stripeBlue)"/>
      <path d="M32,16 A16,14 0 0 0 64,16 Z" fill="url(#stripeIvory)"/>
    </pattern>

    <linearGradient id="awningGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.66"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- ===================== window ===================== -->
    <linearGradient id="frame" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0"    stop-color="#84C6F8"/>
      <stop offset="0.30" stop-color="#4796E2"/>
      <stop offset="0.68" stop-color="#2A6EBB"/>
      <stop offset="1"    stop-color="#1A4C8C"/>
    </linearGradient>

    <linearGradient id="mullion" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#4E9BE2"/>
      <stop offset="0.42" stop-color="#8CC9F6"/>
      <stop offset="1"    stop-color="#2C73BF"/>
    </linearGradient>

    <linearGradient id="glass" x1="0.12" y1="0" x2="0.86" y2="1">
      <stop offset="0"    stop-color="#EDFAFF"/>
      <stop offset="0.20" stop-color="#CEEBFF"/>
      <stop offset="0.55" stop-color="#A8DAF9"/>
      <stop offset="0.84" stop-color="#8EC9F3"/>
      <stop offset="1"    stop-color="#B9E0F8"/>
    </linearGradient>

    <radialGradient id="glassBounce" cx="0.5" cy="0.64" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFFEF9"/>
      <stop offset="0.42" stop-color="#F3EADA"/>
      <stop offset="1"    stop-color="#CFC0A4"/>
    </linearGradient>

    <clipPath id="glassClip">
      <path d="M50,210 V150 A50,50 0 0 1 150,150 V210 Z"/>
    </clipPath>

    <g id="windowUnit">
      <!-- cast shadow on the plaster -->
      <path d="M42,214 V150 A58,58 0 0 1 158,150 V214 Z"
            fill="#16467F" opacity="0.20" filter="url(#blur10)"/>

      <!-- blue outer molding -->
      <path d="M42,214 V150 A58,58 0 0 1 158,150 V214 Z" fill="url(#frame)"/>
      <path d="M42,214 V150 A58,58 0 0 1 158,150 V214 Z"
            fill="none" stroke="#CDE9FC" stroke-width="1.6" stroke-opacity="0.75"/>
      <path d="M48,212 V150 A52,52 0 0 1 152,150 V212"
            fill="none" stroke="#123F77" stroke-width="1.4" stroke-opacity="0.42"/>

      <!-- glass -->
      <path d="M50,210 V150 A50,50 0 0 1 150,150 V210 Z" fill="url(#glass)"/>
      <g clip-path="url(#glassClip)">
        <ellipse cx="100" cy="176" rx="54" ry="46" fill="url(#glassBounce)"/>
        <!-- soft sky reflections -->
        <path d="M52,212 L92,212 L124,98 L108,98 Z"  fill="#FFFFFF" opacity="0.30"/>
        <path d="M118,212 L132,212 L152,102 L142,102 Z" fill="#FFFFFF" opacity="0.16"/>
        <path d="M50,198 L53,198 L116,104 L108,104 Z" fill="#FFFFFF" opacity="0.11"/>
        <!-- faint sky band inside the arch -->
        <path d="M46,146 A54,54 0 0 1 154,146 L154,152 A48,48 0 0 0 46,152 Z"
              fill="#7FBDE8" opacity="0.30"/>
        <!-- inner top shading -->
        <path d="M46,104 A54,54 0 0 1 154,104 L154,116 A42,42 0 0 0 46,116 Z"
              fill="#2B6FB4" opacity="0.22"/>
      </g>

      <!-- cross dividers -->
      <rect x="97.3" y="100" width="5.4" height="110" fill="url(#mullion)"/>
      <rect x="98.4" y="102" width="1.8" height="106" fill="#EAF8FF" opacity="0.55"/>
      <rect x="50" y="152.3" width="100" height="5.4" fill="url(#mullion)"/>
      <rect x="51" y="153.4" width="98" height="1.8" fill="#EAF8FF" opacity="0.55"/>

      <!-- inner reveal -->
      <path d="M50,210 V150 A50,50 0 0 1 150,150 V210"
            fill="none" stroke="#123F77" stroke-width="2" stroke-opacity="0.28"/>

      <!-- sill -->
      <rect x="32" y="208" width="136" height="15" rx="7.5" fill="url(#sill)" filter="url(#softTight)"/>
      <rect x="33" y="209" width="134" height="4" rx="2" fill="#FFFFFF" opacity="0.75"/>
      <rect x="42" y="220" width="116" height="2.6" rx="1.3" fill="#8FB4CE" opacity="0.34"/>
    </g>

    <!-- ===================== lamp ===================== -->
    <linearGradient id="dome" x1="0.18" y1="0" x2="0.86" y2="1">
      <stop offset="0"    stop-color="#A6D8FB"/>
      <stop offset="0.24" stop-color="#5BA9EC"/>
      <stop offset="0.60" stop-color="#2F79C3"/>
      <stop offset="0.88" stop-color="#1F5A9E"/>
      <stop offset="1"    stop-color="#174C8D"/>
    </linearGradient>

    <radialGradient id="goldInner" cx="0.5" cy="0.34" r="0.76">
      <stop offset="0"    stop-color="#FFF6D6"/>
      <stop offset="0.38" stop-color="#FFDB7C"/>
      <stop offset="0.76" stop-color="#EFB043"/>
      <stop offset="1"    stop-color="#C67E1D"/>
    </radialGradient>

    <radialGradient id="lampGlow" cx="0.5" cy="0.30" r="0.62">
      <stop offset="0"    stop-color="#FFE6A2" stop-opacity="0.62"/>
      <stop offset="0.42" stop-color="#FFE9B4" stop-opacity="0.24"/>
      <stop offset="1"    stop-color="#FFEEC6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFE9AF" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#FFF1C9" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#FFF7DF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="domeClip">
      <path d="M210,162 A46,72 0 0 1 302,162 Z"/>
    </clipPath>

    <!-- ===================== room shading ===================== -->
    <linearGradient id="edgeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4F90" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1B4F90" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sideShadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B4F90" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#1B4F90" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sideShadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#1B4F90" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#1B4F90" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#E4F1FC"/>
      <stop offset="0.40" stop-color="#DCECF9"/>
      <stop offset="1"    stop-color="#CAE1F4"/>
    </linearGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.80">
      <stop offset="0.62" stop-color="#16467F" stop-opacity="0"/>
      <stop offset="1"    stop-color="#16467F" stop-opacity="0.13"/>
    </radialGradient>

    <!-- ===================== filters ===================== -->
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0E3D70" flood-opacity="0.20"/>
    </filter>
    <filter id="softTight" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0E3D70" flood-opacity="0.22"/>
    </filter>
    <filter id="blur10" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="blur5" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- ===================== plaster wall ===================== -->
  <rect width="512" height="910" fill="url(#wall)"/>
  <ellipse cx="256" cy="86" rx="320" ry="150" fill="url(#ceilCove)"/>
  <rect width="512" height="910" fill="url(#wallGlow)"/>

  <rect x="0" y="0" width="512" height="150" fill="url(#edgeShade)" opacity="0.7"/>
  <rect x="0" y="0" width="24" height="910" fill="url(#sideShadeL)"/>
  <rect x="488" y="0" width="24" height="910" fill="url(#sideShadeR)"/>

  <!-- ===================== floor line ===================== -->
  <path d="M0,610 H512 V910 H0 Z" fill="url(#floor)"/>
  <path d="M0,610 H512 V616 H0 Z" fill="#FFFFFF" opacity="0.26"/>
  <ellipse cx="256" cy="742" rx="244" ry="132" fill="#FFFFFF" opacity="0.14" filter="url(#blur10)"/>

  <!-- ===================== light pool from the dome ===================== -->
  <path d="M212,166 L136,332 L376,332 L300,166 Z" fill="url(#cone)" filter="url(#blur10)"/>

  <!-- ===================== windows ===================== -->
  <use xlink:href="#windowUnit" href="#windowUnit"/>
  <use xlink:href="#windowUnit" href="#windowUnit" transform="translate(310,0)"/>

  <!-- ===================== pendant dome lamp ===================== -->
  <g>
    <!-- glow halo on plaster -->
    <ellipse cx="256" cy="148" rx="88" ry="86" fill="url(#lampGlow)"/>
    <!-- shadow under the dome -->
    <ellipse cx="256" cy="174" rx="50" ry="11" fill="#16467F" opacity="0.15" filter="url(#blur5)"/>

    <!-- dome body: apex 90, rim 162, x 210..302 -->
    <path d="M210,162 A46,72 0 0 1 302,162 Z" fill="url(#dome)" filter="url(#soft)"/>

    <g clip-path="url(#domeClip)">
      <!-- ambient occlusion on the right + under the rim -->
      <ellipse cx="272" cy="150" rx="46" ry="70" fill="#123F77" opacity="0.20"/>
      <ellipse cx="256" cy="158" rx="58" ry="26" fill="#123F77" opacity="0.16"/>
      <!-- specular highlight -->
      <ellipse cx="234" cy="122" rx="11" ry="30" fill="#FFFFFF" opacity="0.50" transform="rotate(15 234 122)"/>
      <ellipse cx="241" cy="116" rx="4"  ry="17" fill="#FFFFFF" opacity="0.78" transform="rotate(15 241 116)"/>
      <ellipse cx="286" cy="144" rx="4"  ry="13" fill="#C6E9FF" opacity="0.26" transform="rotate(-12 286 144)"/>
      <!-- bottom bounce light spilling up inside the shell -->
      <ellipse cx="256" cy="162" rx="46" ry="18" fill="#FFE7A8" opacity="0.30"/>
    </g>

    <!-- rim highlight along the left shell edge -->
    <path d="M215,158 A46,72 0 0 1 246,92" fill="none"
          stroke="#EAF8FF" stroke-width="2" stroke-opacity="0.55"/>

    <!-- brass ceiling collar at the apex -->
    <ellipse cx="256" cy="92"  rx="7.5" ry="3.4" fill="#B8862B"/>
    <ellipse cx="256" cy="90.5" rx="7.5" ry="3.2" fill="#FFE9A6"/>
    <ellipse cx="256" cy="90.2" rx="4"   ry="1.6" fill="#FFFBE8" opacity="0.9"/>

    <!-- gold interior bowl + warm glow -->
    <ellipse cx="256" cy="162" rx="46" ry="9.5" fill="url(#goldInner)"/>
    <ellipse cx="256" cy="162.4" rx="33" ry="5.8" fill="#FFF8DC" opacity="0.85"/>
    <ellipse cx="256" cy="162" rx="46" ry="9.5" fill="none" stroke="#1B4F90" stroke-width="3"/>
    <ellipse cx="256" cy="162" rx="46" ry="9.5" fill="none" stroke="#A6D7F8" stroke-width="1" stroke-opacity="0.55"/>
    <ellipse cx="256" cy="176" rx="62" ry="28" fill="url(#lampGlow)" opacity="0.85"/>
  </g>

  <!-- ===================== scalloped awning 0..30 ===================== -->
  <g>
    <rect x="0" y="0" width="512" height="30" fill="url(#awning)"/>
    <rect x="0" y="0" width="512" height="16" fill="url(#awningGloss)"/>
    <rect x="0" y="0" width="512" height="2.4" fill="#1B4F90" opacity="0.18"/>
    <rect x="0" y="29" width="512" height="1.4" fill="#1B4F90" opacity="0.10"/>
  </g>
  <rect x="0" y="30" width="512" height="20" fill="url(#edgeShade)" opacity="0.50"/>

  <!-- ===================== finishing ===================== -->
  <rect width="512" height="910" fill="url(#vignette)"/>
</svg>
