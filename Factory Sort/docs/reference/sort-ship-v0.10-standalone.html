<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3b2a20">
<title>Sort &amp; Ship</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap');
:root{
  --ink:#3b2a20; --ink2:#6b4f3f; --cream:#f7ecd9; --cream2:#efdfc6; --paper:#fffdf7;
  --wood:#c98b4e; --wood2:#a86a34; --wood3:#7d4b22; --board:#f3e2c7;
  --belt:#4b4b55; --belt2:#33333b; --chev:#ffd15c; --pad:#5d5d69;
  --accent:#ff8a3d; --accent2:#ffb347; --good:#4fae5a; --bad:#e4574b; --blue:#4f8de0;
  --shadow:0 6px 0 rgba(59,42,32,.18);
}
html,body{height:100%}
body{margin:0;background:#3b2a20;color:var(--ink);font-family:'Nunito','Segoe UI',Roboto,Arial,sans-serif;font-weight:700;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:50%;top:50%;width:390px;height:844px;transform-origin:0 0;overflow:hidden;border-radius:26px;
  background-color:var(--cream);
  background-image:radial-gradient(rgba(59,42,32,.07) 1.2px, transparent 1.3px);
  background-size:14px 14px;}
#stage *{box-sizing:border-box}
.display{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800}
.hidden{display:none !important}
button{font:inherit;color:inherit}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;top:0;width:390px;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.pill{height:36px;padding:0 12px;border-radius:18px;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;font-size:15px}
.pill.lvl{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px}
.pill .tier{font-size:10px;color:#fff;padding:2px 7px;border-radius:9px;border:1.5px solid var(--ink);line-height:1.2;-webkit-text-stroke:0}
.pill .ico{width:18px;height:18px}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.iconbtn:active,.pill.btn:active,.bigbtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(59,42,32,.18)}
#hudProg{display:flex;flex-direction:column;align-items:center;gap:3px}
#hudProg .txt{font-size:12px;color:var(--ink2)}
#hudProg .bar{width:120px;height:10px;border-radius:6px;background:var(--paper);border:2px solid var(--ink);overflow:hidden}
#hudProg .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .4s cubic-bezier(.2,.8,.2,1)}

/* ---------- Belt & orders ---------- */
#beltArea{position:absolute;left:0;top:60px;width:390px;height:240px}
#beltSvg{position:absolute;left:0;top:0}
#beltArea.warn #beltGlow{opacity:1;animation:pulse 1s infinite}
#beltArea.full #beltGlow{opacity:1;stroke:var(--bad);animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
#cnt{position:absolute;right:16px;top:14px;display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2)}
#cnt b{color:var(--ink);font-size:15px}
#orders{position:absolute;left:46px;top:72px;width:298px;height:92px;display:flex;align-items:center;justify-content:center;gap:7px}
.ticket{position:relative;width:66px;height:86px;border-radius:8px;background:#fbf3e4;border:2px solid var(--ink);box-shadow:0 3px 0 rgba(59,42,32,.15);display:flex;flex-direction:column;align-items:center;padding:3px 3px 4px;gap:3px;transform:rotate(var(--rot,0deg))}
.ticket .ohead{display:flex;align-items:center;justify-content:center;gap:3px;height:24px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:13px;color:var(--ink)}
.ticket .ohead svg{width:22px;height:22px}
.ticket .ocarton{position:relative;width:56px;height:48px;border-radius:5px;background:#d9a066;border:2px solid var(--ink);overflow:hidden}
.ticket .ocarton::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:#b9814a;border-bottom:1.5px solid rgba(59,42,32,.6)}
.ticket .oslots{position:absolute;left:0;right:0;top:11px;display:flex;justify-content:center;gap:2px;padding:0 2px}
.req{width:17px;height:15px;border-radius:3px;border:1.2px dashed rgba(59,42,32,.5);background:rgba(255,253,247,.5);display:flex;align-items:center;justify-content:center;position:relative}
.req svg{width:17px;height:15px;opacity:.28}
.req.filled{border:1.2px solid var(--ink);background:#fffdf7}
.req.filled svg{opacity:1}
.req.filled::after{content:"";position:absolute;right:-4px;bottom:-4px;width:9px;height:9px;border-radius:50%;background:var(--good);border:1.2px solid var(--ink)}
.req.pop{animation:reqpop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes reqpop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.ticket .lid{position:absolute;left:0;right:0;top:0;height:0;background:#d9a066;border-bottom:2px solid var(--ink);transition:height .22s ease-in;overflow:hidden}
.ticket .lid i{position:absolute;left:50%;top:0;width:8px;height:100%;margin-left:-4px;background:#f5e6c8;border-left:1.2px solid var(--ink);border-right:1.2px solid var(--ink)}
.ticket.done .lid{height:100%}
.ticket.done{background:#e8f6e6;border-color:var(--good)}
.ticket.leave{animation:leave .35s ease-in forwards}
@keyframes leave{to{transform:translateY(-70px) rotate(8deg);opacity:0}}
.ticket.enter{animation:enter .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes enter{from{transform:translateY(60px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.flybox{position:absolute;left:0;top:0;margin:-43px 0 0 -33px;pointer-events:none;z-index:170;visibility:visible !important}
.truckrow{display:flex;align-items:center;gap:6px}
#hudTruck.bump{animation:bump .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:translateY(0)}30%{transform:translateY(-6px) rotate(-4deg)}60%{transform:translateY(1px)}100%{transform:none}}
.ticket.plus{border:2px dashed rgba(59,42,32,.5);background:rgba(255,253,247,.6);justify-content:center;gap:4px;cursor:pointer;box-shadow:none}
.ticket.plus::before{display:none}
.ticket.plus .lbl{font-size:9.5px;color:var(--ink2);text-align:center;line-height:1.1}
.ticket.plus:active{transform:scale(.95)}
.ticket.emptyslot{border:2px dashed rgba(59,42,32,.35);background:transparent;box-shadow:none}
.ticket.emptyslot::before{display:none}
#crates{position:absolute;left:0;top:0;width:390px;height:240px;pointer-events:none}
.crate{position:absolute;left:0;top:0;width:30px;height:26px;margin:-13px 0 0 -15px;will-change:transform}
.crate svg{display:block;width:30px;height:26px;overflow:visible}
.crate .stk{position:absolute;left:8px;top:9px;width:14px;height:14px}
.crate.hot{filter:drop-shadow(0 0 6px var(--accent2))}

/* ---------- Shelves ---------- */
#shelves{position:absolute;left:0;top:300px;width:390px;height:470px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:6px 2px 6px}
.cases{display:flex;justify-content:center;align-items:flex-start;gap:4px}
.case{display:flex;flex-direction:column;gap:9px;padding:6px 1px 8px;border-radius:12px;background:linear-gradient(180deg,var(--wood) 0%,var(--wood2) 100%);border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--wood3),0 8px 0 rgba(59,42,32,.18)}
.shelf{position:relative;display:flex;gap:2px;padding:2px 2px 3px;border-radius:7px;background:rgba(255,246,230,.28)}
.shelf::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-5px;height:6px;border-radius:3px;background:var(--wood3);border:1.5px solid var(--ink)}
.shelf.hot{animation:shelfpop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes shelfpop{0%{transform:scale(1)}40%{transform:scale(1.08,.9)}100%{transform:scale(1)}}
.slot{width:37px;height:37px;border-radius:7px;background:rgba(255,250,240,.92);border:1.5px solid rgba(59,42,32,.25);display:flex;align-items:center;justify-content:center;position:relative}
.slot.has{border-color:rgba(59,42,32,.5)}
.slot.target{border:2px solid var(--accent);background:#fff3e0;box-shadow:0 0 0 3px rgba(255,138,61,.35);animation:tgt .6s infinite alternate}
@keyframes tgt{to{box-shadow:0 0 0 6px rgba(255,138,61,.15)}}
.slot.ok{border-color:var(--accent);}
.item{width:35px;height:35px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;transition:transform .15s}
.item svg{width:34px;height:34px;filter:drop-shadow(0 1.5px 0 rgba(59,42,32,.25))}
.item.hidden{opacity:0}
.item.pulse{animation:itempulse 1s infinite}
@keyframes itempulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.lock{position:absolute;inset:-2px;z-index:3;background:rgba(59,42,32,.72);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;font-size:10.5px;line-height:1;backdrop-filter:blur(1px)}
.lock b{font-family:'Baloo 2',sans-serif;font-size:14px}
.lock.open{animation:lockopen .5s forwards}
@keyframes lockopen{to{opacity:0;transform:scale(1.3)}}
#ghost{position:absolute;left:0;top:0;width:48px;height:48px;margin:-24px 0 0 -24px;pointer-events:none;display:none;z-index:50;filter:drop-shadow(0 8px 6px rgba(59,42,32,.35));transform-origin:center}
#ghost svg{width:48px;height:48px}
.flyitem{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;z-index:40}
.flyitem svg{width:34px;height:34px}

/* ---------- Bottom bar ---------- */
#bottom{position:absolute;left:0;bottom:0;width:390px;height:74px;display:flex;justify-content:center;align-items:center;gap:18px}
.boost{position:relative;width:78px;height:54px;border-radius:16px;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;font-size:10.5px;color:var(--ink2)}
.boost svg{width:22px;height:22px}
.boost:disabled{opacity:.45;cursor:default}
.boost .n{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:#fff;border:2px solid var(--ink);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}

/* ---------- Screens / modals ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:200;background:var(--cream);background-image:radial-gradient(rgba(59,42,32,.07) 1.2px, transparent 1.3px);background-size:14px 14px}
.logo{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:56px;line-height:.95;text-align:center;color:var(--accent);-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink);letter-spacing:1px}
.logo small{display:block;font-size:22px;color:var(--paper);-webkit-text-stroke:1.5px var(--ink);text-shadow:0 3px 0 var(--ink)}
.bigbtn{min-width:200px;height:58px;padding:0 20px;border-radius:20px;background:var(--accent);color:#fff;border:2.5px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;white-space:nowrap;cursor:pointer;-webkit-text-stroke:.5px var(--ink)}
.bigbtn.sec{background:var(--paper);color:var(--ink);-webkit-text-stroke:0;font-size:18px;height:50px}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.overlay{position:absolute;inset:0;background:rgba(59,42,32,.55);display:flex;align-items:center;justify-content:center;z-index:300;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:310px;background:var(--paper);border:2.5px solid var(--ink);border-radius:22px;padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 8px 0 rgba(59,42,32,.25);animation:popin .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:30px;line-height:1.1}
.modal p{margin:0;font-size:14px;color:var(--ink2);font-weight:600}
.modal .bigbtn{width:100%;min-width:0}
.stars{display:flex;gap:8px;height:56px;align-items:center}
.stars svg{width:48px;height:48px;transform:scale(0)}
.stars svg.on{animation:starpop .5s cubic-bezier(.2,1.6,.4,1) forwards}
.stars svg.off{transform:scale(1);opacity:.25}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.levels{display:flex;flex-direction:column;gap:8px;width:320px}
.tierhead{display:flex;align-items:center;gap:8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;margin-top:4px}
.tierhead i{display:block;width:12px;height:12px;border-radius:4px;border:1.5px solid var(--ink)}
.tierrow{display:flex;gap:10px;flex-wrap:wrap}
.lv{width:66px;height:62px;border-radius:16px;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 4px 0 rgba(59,42,32,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;padding:0}
.lv .s{display:flex;gap:1px}
.lv .s svg{width:13px;height:13px}
.lv.locked{opacity:.5;background:var(--cream2)}
.lv.cur{background:#fff3e0;border-color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:16px}
.sw{width:54px;height:30px;border-radius:15px;background:#cdbba3;border:2px solid var(--ink);position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .2s}
.sw.on{background:var(--good)}
.sw.on::after{left:26px}
.coins{display:flex;align-items:center;gap:6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px}
.coins svg{width:22px;height:22px}
#fx{position:absolute;left:0;top:0;width:390px;height:844px;pointer-events:none;z-index:150}
#toast{position:absolute;left:50%;top:310px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 14px;border-radius:20px;z-index:160;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:.96}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#stage.quake{animation:quake .25s}
@keyframes quake{0%,100%{margin-left:0}25%{margin-left:-3px}50%{margin-left:3px}75%{margin-left:-2px}}
/* tutorial */
#tut{position:absolute;inset:0;pointer-events:none;z-index:180}
#tutHand{position:absolute;left:0;top:0;width:44px;height:44px;margin:-6px 0 0 -10px;transition:none}
#tutBox{position:absolute;left:24px;right:24px;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.35;box-shadow:0 5px 0 rgba(59,42,32,.25);pointer-events:auto}
#tutBox .tap{display:block;margin-top:6px;font-size:11px;color:var(--ink2)}
.floatText{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;color:var(--accent);-webkit-text-stroke:1px var(--ink);pointer-events:none;z-index:170;animation:floatUp .9s ease-out forwards}
@keyframes floatUp{to{transform:translate(-50%,-140%);opacity:0}}

/* ---------- title hero ---------- */
.hero{position:relative;width:340px;height:150px;margin-bottom:-6px}
.heroBelt{position:absolute;left:10px;top:50px}
.heroChev{animation:chev 1.2s linear infinite}
@keyframes chev{to{transform:translateX(30px)}}
.heroCrates{animation:crates 4s linear infinite}
@keyframes crates{from{transform:translateX(-60px)}to{transform:translateX(50px)}}
.fl{position:absolute;width:38px;height:38px;filter:drop-shadow(0 3px 0 rgba(59,42,32,.25));animation:floaty 3s ease-in-out infinite}
.f1{left:8px;top:6px;animation-delay:0s}.f2{left:80px;top:-6px;animation-delay:.6s;width:32px}.f3{left:160px;top:10px;animation-delay:1.2s}.f4{left:230px;top:-4px;animation-delay:1.8s;width:34px}.f5{left:296px;top:12px;animation-delay:2.4s}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
.tagline{font-size:14px;color:var(--ink2);margin-top:-6px;letter-spacing:.5px}

.bigbox{position:absolute;left:0;top:0;width:44px;height:40px;margin:-20px 0 0 -22px;pointer-events:none;z-index:45;opacity:0;filter:drop-shadow(0 4px 3px rgba(59,42,32,.3))}
.bigbox .flap{transition:none}

/* lớp sau (món bị che) */
.slot.layered{background:rgba(235,222,200,.95)}
.slot .back{position:absolute;left:1px;top:-4px;width:28px;height:28px;opacity:.75;filter:brightness(.72) saturate(.7);transform:scale(.9);z-index:0;pointer-events:none}
.slot .back svg{width:26px;height:26px}
.slot .back i{position:absolute;right:-6px;top:-5px;min-width:13px;height:13px;border-radius:7px;background:var(--ink);color:#fff;font-size:9px;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 3px;opacity:1;filter:none}
.slot .item{position:relative;z-index:1}
.item.reveal{animation:reveal .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes reveal{0%{transform:translate(-3px,-4px) scale(.82);filter:brightness(.7)}100%{transform:none;filter:none}}

/* tầng đã đóng */
.shelf.closed .slot{opacity:.35}
.shut{position:absolute;left:-2px;right:-2px;top:-2px;bottom:-4px;border-radius:8px;background:repeating-linear-gradient(180deg,#a86a34 0 6px,#8b552a 6px 12px);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;color:#fff3e0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:11px;letter-spacing:.5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);z-index:2}
.shut span{background:rgba(59,42,32,.55);padding:1px 7px;border-radius:6px}
.shut.closing{transform:translateY(-110%);transition:transform .25s cubic-bezier(.3,1.2,.5,1)}
.shut.closing.down{transform:none}
/* băng di chuyển kệ */
#track{position:relative;width:378px;height:70px;border-radius:12px;overflow:hidden;background:#33333b;border:2.5px solid var(--ink);box-shadow:0 4px 0 rgba(59,42,32,.2);flex-shrink:0}
#track .tbelt{position:absolute;left:0;top:0;right:0;bottom:0;background-image:repeating-linear-gradient(90deg,#4b4b55 0 26px,#5a5a66 26px 30px);opacity:.9}
#track::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(255,209,92,.55) 14px 20px)}
.tunit{position:absolute;left:0;top:7px;width:123px;padding:3px 2px 5px;border-radius:9px;background:linear-gradient(180deg,var(--wood) 0%,var(--wood2) 100%);border:2px solid var(--ink);box-shadow:0 3px 0 var(--wood3);will-change:transform}
.tunit .shelf{padding:2px 2px 3px;gap:2px;background:rgba(255,246,230,.3)}
.tunit .shelf::after{display:none}

.slot.swapok{border:2px dashed var(--blue);background:#eaf2ff}
.slot.swapok.target{border-style:solid;box-shadow:0 0 0 3px rgba(79,141,224,.35)}
#autoBanner{position:absolute;left:50%;top:274px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:13px;padding:5px 12px;border-radius:14px;z-index:120;animation:pulse 1s infinite}

/* bàn kệ bố cục tự do */
.board{position:relative;flex-shrink:0}
.unit{position:absolute;width:123px;padding:3px 2px 6px;border-radius:9px;background:linear-gradient(180deg,var(--wood) 0%,var(--wood2) 100%);border:2px solid var(--ink);box-shadow:0 3px 0 var(--wood3),0 5px 0 rgba(59,42,32,.15)}
.unit .shelf::after{display:none}

/* viền màn hình lập lòe khi auto */
#stage.autofx::after{content:"";position:absolute;inset:0;border-radius:26px;pointer-events:none;z-index:140;box-shadow:inset 0 0 0 4px rgba(255,209,92,.9),inset 0 0 40px 10px rgba(255,138,61,.45);animation:edgeglow .7s ease-in-out infinite alternate}
@keyframes edgeglow{from{box-shadow:inset 0 0 0 3px rgba(255,209,92,.55),inset 0 0 24px 6px rgba(255,138,61,.2)}to{box-shadow:inset 0 0 0 6px rgba(255,209,92,1),inset 0 0 60px 16px rgba(255,138,61,.55)}}

</style>
</head>
<body>

<script>
/* Sort & Ship — core rules (không DOM). Dùng chung cho game và solver.
   State là plain object để clone bằng JSON. Mọi hàm mutate state và trả về danh sách event cho view animate. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SortCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  function key(c, r) { return c + ',' + r; }

  function newGame(level) {
    const S = {
      rows: level.rows,
      grid: level.grid.map(col => col.map(sh => sh.slice())),
      // lớp sau: deep[c][r][k] = danh sách món nằm SAU món trước ở ô đó (phần tử cuối = gần mặt nhất)
      deep: level.deep ? level.deep.map(col => col.map(sh => sh.map(st => st.slice()))) : level.grid.map(col => col.map(sh => sh.map(() => []))),
      locked: Object.assign({}, level.locked || {}),
      closed: {},          // tầng đã đóng sau khi clear (không dùng được nữa)
      track: level.track || 0,   // số ô kệ trên băng di chuyển (cột index 1)
      layout: level.layout || null,
      queue: level.orders.map((reqs, i) => ({ id: i, reqs: reqs.slice(), filled: reqs.map(() => false) })),
      active: [],
      activeSlots: level.activeSlots || 3,
      cap: level.cap || 6,
      crates: [],          // {id, t, slot}
      crateSeq: 0,
      pending: null,       // thùng kẹt ở cổng khi băng đầy
      done: 0,
      total: level.orders.length,
      status: 'play',      // play | win | lose
      moves: 0,
      maxBelt: 0,
      extended: false,
      extraSlot: false,   // đã xem QC mở thêm 1 ô đơn
    };
    for (let i = 0; i < 4; i++) S.active.push(i < S.activeSlots ? (S.queue.shift() || null) : null);
    return S;
  }

  function clone(S) { return JSON.parse(JSON.stringify(S)); }

  function shelfLocked(S, c, r) { return !!S.locked[key(c, r)] || !!S.closed[key(c, r)]; }
  function cols(S) { return S.grid.length; }
  function rowsOf(S, c) { return S.grid[c].length; }

  // mọi nước đi hợp lệ: món (c,r,k) -> ô trống (c2,r2,k2) ở kệ khác không khóa
  function moves(S) {
    const out = [];
    if (S.status !== 'play') return out;
    for (let c = 0; c < cols(S); c++) for (let r = 0; r < rowsOf(S, c); r++) {
      if (shelfLocked(S, c, r)) continue;
      const sh = S.grid[c][r];
      for (let k = 0; k < 3; k++) {
        const t = sh[k]; if (!t) continue;
        for (let c2 = 0; c2 < cols(S); c2++) for (let r2 = 0; r2 < rowsOf(S, c2); r2++) {
          if (c2 === c && r2 === r) continue;
          if (shelfLocked(S, c2, r2)) continue;
          const k2 = S.grid[c2][r2].indexOf(null);
          if (k2 >= 0) out.push({ from: [c, r, k], to: [c2, r2, k2], t });
        }
      }
    }
    return out;
  }

  function isLegal(S, mv) {
    const [c, r, k] = mv.from, [c2, r2, k2] = mv.to;
    if (S.status !== 'play') return false;
    if (c === c2 && r === r2) return false;
    if (shelfLocked(S, c, r) || shelfLocked(S, c2, r2)) return false;
    if (!S.grid[c][r][k]) return false;
    return true;   // ô đích trống = di chuyển; có món = đổi chỗ hai món trước
  }

  // lấy món trước ra khỏi ô; nếu có món phía sau thì món đó lộ ra thành món trước
  function takeFront(S, c, r, k, ev) {
    const t = S.grid[c][r][k];
    const st = S.deep[c][r][k];
    if (st && st.length) { const nt = st.pop(); S.grid[c][r][k] = nt; ev.push({ type: 'reveal', c, r, k, t: nt, left: st.length }); }
    else S.grid[c][r][k] = null;
    return t;
  }

  function move(S, mv) {
    if (!isLegal(S, mv)) return null;
    const [c, r, k] = mv.from, [c2, r2, k2] = mv.to;
    const t = S.grid[c][r][k], t2 = S.grid[c2][r2][k2];
    if (t2) {
      if (t2 === t) return null;                       // đổi hai món giống nhau: vô nghĩa
      S.moves++;
      const ev = [{ type: 'swap', from: mv.from, to: mv.to, t, t2 }];
      S.grid[c][r][k] = t2; S.grid[c2][r2][k2] = t;    // đổi chỗ, lớp sau giữ nguyên
      checkShelf(S, c2, r2, ev); checkShelf(S, c, r, ev);
      checkStuck(S, ev);
      return ev;
    }
    S.moves++;
    const ev = [{ type: 'move', from: mv.from, to: mv.to, t }];
    takeFront(S, c, r, k, ev);
    S.grid[c2][r2][k2] = t;
    checkShelf(S, c2, r2, ev);
    checkStuck(S, ev);
    return ev;
  }

  function checkShelf(S, c, r, ev) {
    const sh = S.grid[c][r];
    if (!(sh[0] && sh[0] === sh[1] && sh[1] === sh[2])) return;
    const t = sh[0];
    const packEv = { type: 'pack', c, r, t, crateId: S.crateSeq };
    ev.push(packEv);
    for (let k = 0; k < 3; k++) takeFront(S, c, r, k, ev);   // món sau lộ ra sau khi đóng thùng
    if (S.grid[c][r].every(x => !x)) { S.closed[key(c, r)] = true; ev.push({ type: 'close', c, r }); }   // tầng trống sau khi đóng thùng → đóng tầng
    // mở khóa
    for (const kk in S.locked) {
      S.locked[kk]--;
      if (S.locked[kk] <= 0) { delete S.locked[kk]; const [lc, lr] = kk.split(',').map(Number); ev.push({ type: 'unlock', c: lc, r: lr }); }
      else ev.push({ type: 'lockTick', key: kk, left: S.locked[kk] });
    }
    const crate = { id: S.crateSeq++, t, slot: -1 };   // id trùng packEv.crateId
    routeCrate(S, crate, ev, { c, r });
  }

  // Order nào đang cần loại t? trả về {oi, j}
  function findOrderFor(S, t) {
    for (let i = 0; i < 4; i++) {
      const o = S.active[i]; if (!o) continue;
      for (let j = 0; j < o.reqs.length; j++) if (o.reqs[j] === t && !o.filled[j]) return { oi: i, j };
    }
    return null;
  }

  function beltCount(S) { return S.crates.length; }

  // Thùng LUÔN đi lên băng trước (qua cổng nhập); khớp Order thì bị hút từ băng.
  // Băng đầy: nếu có Order cần thì thùng đi qua cổng rồi được hút thẳng (không chiếm ô); không thì thua.
  function routeCrate(S, crate, ev, from) {
    if (beltCount(S) >= S.cap) {
      const m = findOrderFor(S, crate.t);
      if (m) { ev.push({ type: 'crateViaGate', crate: { id: crate.id, t: crate.t }, from, oi: m.oi, j: m.j, orderId: S.active[m.oi].id }); fillReq(S, m, ev); return; }
      S.pending = crate; S.status = 'lose';
      ev.push({ type: 'beltFull', crate: { id: crate.id, t: crate.t }, from });
      ev.push({ type: 'lose' });
      return;
    }
    let slot = 0; while (S.crates.some(x => x.slot === slot)) slot++;
    crate.slot = slot; S.crates.push(crate);
    ev.push({ type: 'crateToBelt', crate: { id: crate.id, t: crate.t }, from, slot, count: S.crates.length, cap: S.cap });
    resolveBelt(S, ev);
    S.maxBelt = Math.max(S.maxBelt, S.crates.length);   // đo sau khi hút: thùng đi thẳng không tính là "chờ"
  }

  function fillReq(S, m, ev) {
    const o = S.active[m.oi];
    o.filled[m.j] = true;
    ev.push({ type: 'reqFilled', oi: m.oi, j: m.j, orderId: o.id });
    if (o.filled.every(Boolean)) {
      S.done++;
      ev.push({ type: 'orderDone', oi: m.oi, orderId: o.id, done: S.done, total: S.total });
      const nx = S.queue.shift() || null;
      S.active[m.oi] = nx;
      ev.push({ type: 'orderNew', oi: m.oi, order: nx ? { id: nx.id, reqs: nx.reqs.slice() } : null });
      resolveBelt(S, ev);
      checkWin(S, ev);
    }
  }

  // hút thùng trên băng khớp Order, thùng cũ nhất trước; lặp vì một lần hút có thể hoàn thành Order → Order mới
  function resolveBelt(S, ev) {
    let changed = true;
    while (changed) {
      changed = false;
      const onBelt = S.crates.slice().sort((a, b) => a.id - b.id);
      for (const c of onBelt) {
        const m = findOrderFor(S, c.t);
        if (!m) continue;
        S.crates = S.crates.filter(x => x !== c);
        ev.push({ type: 'suck', crate: { id: c.id, t: c.t }, slot: c.slot, oi: m.oi, j: m.j, orderId: S.active[m.oi].id, count: S.crates.length });
        fillReq(S, m, ev);   // có thể đẩy thêm orderDone/orderNew và gọi resolveBelt lồng nhau
        changed = true;
        break;               // danh sách đã đổi → duyệt lại
      }
    }
  }

  // còn nước đi nào không (kể cả đổi chỗ)? không còn → kẹt → thua
  function hasAnyMove(S) {
    const items = [];
    let emptyShelves = 0;
    for (let c = 0; c < cols(S); c++) for (let r = 0; r < rowsOf(S, c); r++) {
      if (shelfLocked(S, c, r)) continue;
      const sh = S.grid[c][r]; const n = sh.filter(Boolean).length;
      if (n < 3) emptyShelves++;
      for (const t of sh) if (t) items.push({ t, c, r });
    }
    if (!items.length) return false;
    // có ô trống ở kệ khác kệ chứa món → di chuyển được
    for (const it of items) for (let c = 0; c < cols(S); c++) for (let r = 0; r < rowsOf(S, c); r++) { if ((c === it.c && r === it.r) || shelfLocked(S, c, r)) continue; if (S.grid[c][r].includes(null)) return true; }
    // hai món khác loại ở hai kệ khác nhau → đổi chỗ được
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) if (items[i].t !== items[j].t && !(items[i].c === items[j].c && items[i].r === items[j].r)) return true;
    return false;
  }
  function checkStuck(S, ev) {
    if (S.status !== 'play') return;
    if (!hasAnyMove(S)) { S.status = 'lose'; S.stuck = true; ev.push({ type: 'stuck' }); ev.push({ type: 'lose' }); }
  }

  function checkWin(S, ev) {
    if (S.status !== 'play') return;
    if (S.queue.length === 0 && S.active.every(o => !o)) { S.status = 'win'; ev.push({ type: 'win', moves: S.moves, maxBelt: S.maxBelt }); }
  }

  // ---- booster / hành động phụ ----
  // xem QC: mở thêm một ô đơn (2 → 3)
  function unlockExtra(S) {
    if (S.extraSlot || S.status !== 'play' || S.activeSlots >= 4) return null;
    S.extraSlot = true; const oi = S.activeSlots; S.activeSlots++;
    const nx = S.queue.shift() || null; S.active[oi] = nx;
    const ev = [{ type: 'extraSlot', oi, order: nx ? { id: nx.id, reqs: nx.reqs.slice() } : null }];
    resolveBelt(S, ev); checkWin(S, ev);
    return ev;
  }

  // đổi Order đầu tiên chưa có thùng nào với Order kế tiếp trong hàng chờ
  function swapOrder(S) {
    if (S.status !== 'play' || S.queue.length === 0) return null;
    const i = S.active.findIndex(o => o && !o.filled.some(Boolean));
    if (i < 0) return null;

    resolveBelt(S, ev); checkWin(S, ev);
    return ev;
  }

  // nam châm: gom 3 món của loại t (ưu tiên loại Order đang cần) về một kệ và đóng thùng
  function magnet(S) {
    if (S.status !== 'play') return null;
    const counts = {};
    for (let c = 0; c < cols(S); c++) for (let r = 0; r < rowsOf(S, c); r++) { if (shelfLocked(S, c, r)) continue; for (const t of S.grid[c][r]) if (t) counts[t] = (counts[t] || 0) + 1; }
    const wanted = [];
    for (const o of S.active) if (o) o.reqs.forEach((t, j) => { if (!o.filled[j]) wanted.push(t); });
    let pick = wanted.find(t => counts[t] >= 3) || Object.keys(counts).find(t => counts[t] >= 3);
    if (!pick) return null;
    // kệ đích: kệ không khóa có nhiều món loại pick nhất
    let best = null, bn = -1;
    for (let c = 0; c < cols(S); c++) for (let r = 0; r < rowsOf(S, c); r++) { if (shelfLocked(S, c, r)) continue; const n = S.grid[c][r].filter(x => x === pick).length; if (n > bn) { bn = n; best = [c, r]; } }
    const [bc, br] = best;
    const ev = [];
    const gathered = [];
    // lấy các món pick ở kệ khác
    outer: for (let c = 0; c < cols(S); c++) for (let r = 0; r < rowsOf(S, c); r++) {
      if (shelfLocked(S, c, r) || (c === bc && r === br)) continue;
      for (let k = 0; k < 3; k++) if (S.grid[c][r][k] === pick && bn + gathered.length < 3) { takeFront(S, c, r, k, ev); gathered.push([c, r, k]); if (bn + gathered.length >= 3) break outer; }
    }
    // dọn kệ đích: món khác loại trong kệ đích chuyển sang ô trống vừa giải phóng / ô trống khác
    const others = [];
    for (let k = 0; k < 3; k++) if (S.grid[bc][br][k] && S.grid[bc][br][k] !== pick) { others.push(S.grid[bc][br][k]); S.grid[bc][br][k] = null; }
    // kệ đích không được có lớp sau khác loại: đẩy lớp sau ra ngoài thành món rời
    for (let k = 0; k < 3; k++) { const st = S.deep[bc][br][k]; while (st.length) others.push(st.pop()); }
    const displaced = [];
    for (const t of others) {
      let placed = false;
      for (let c = 0; c < cols(S) && !placed; c++) for (let r = 0; r < rowsOf(S, c) && !placed; r++) { if (shelfLocked(S, c, r) || (c === bc && r === br)) continue; const k = S.grid[c][r].indexOf(null); if (k >= 0) { S.grid[c][r][k] = t; displaced.push({ t, to: [c, r, k] }); placed = true; } }
      if (!placed) { /* không còn chỗ: bỏ qua (hiếm) */ }
    }

    ev.push({ type: 'magnet', t: pick, target: [bc, br], gathered, displaced });
    checkShelf(S, bc, br, ev);

  }

  // Còn ≤ 2 đơn cuối → tự động hoàn thành. Trả về true khi đủ điều kiện.
  function autoReady(S) { return S.status === 'play' && S.queue.length === 0 && S.active.filter(Boolean).length <= 2 && S.active.some(Boolean); }
  // một bước tự động: chọn loại đang cần, gom 3 món về một tầng rồi đóng thùng

    if (S.status !== 'play') return null;

    for (let k = 0; k < 3; k++) { if (S.grid[bc][br][k] && S.grid[bc][br][k] !== pick) others.push(S.grid[bc][br][k]); S.grid[bc][br][k] = null; const st = S.deep[bc][br][k]; while (st.length) others.push(st.pop()); }

      for (let c = 0; c < cols(S) && !placed; c++) for (let r = 0; r < rowsOf(S, c) && !placed; r++) { if ((c === bc && r === br) || S.closed[key(c, r)]) continue; const k = S.grid[c][r].indexOf(null); if (k >= 0) { S.grid[c][r][k] = t; placed = true; } }

// ---------------- event playback ----------------
// Hai lane chạy song song: lane A = việc ở kệ (đóng hộp, lộ món, mở khóa), lane B = việc ở băng/đơn.
// Nhờ vậy đóng hộp liên tiếp không phải xếp hàng chờ thùng trước lên băng.
const SHELF_EV = new Set(['move', 'swap', 'reveal', 'unlock', 'lockTick', 'magnet', 'close', 'auto']);
function enqueue(evs) {
  G.busy++;

  const done = () => { G.busy--; renderBottom(); maybeAuto(); };
  if (i < 0) { const lane = evs.every(e => SHELF_EV.has(e.type)) ? 'laneA' : 'laneB'; G[lane] = G[lane].then(() => playEvents(evs)).catch(err => console.error(err)).then(done); return; }

  const shelfPost = post.filter(e => SHELF_EV.has(e.type) && e.type !== 'close'), closeEvs = post.filter(e => e.type === 'close'), beltPost = post.filter(e => !SHELF_EV.has(e.type));

    await playEvents(pre);
    const h = animPack(packEv); arrivedP = h.arrived;
    await h.left;                       // hộp đã rời kệ → kệ rảnh cho nước tiếp theo

  }).catch(err => console.error(err));

async function playEvents(evs) {

      case 'swap': await animSwapItems(ev); break;
      case 'auto': await animAuto(ev); break;
      case 'pack': { const h = animPack(ev); await h.arrived; break; }
      case 'unlock': await animUnlock(ev); break;
      case 'close': await animClose(ev); break;
      case 'reveal': { const sl = slotEl(ev.c, ev.r, ev.k); if (sl) { const it = sl.querySelector('.item'); if (it) { it.classList.add('reveal'); const [x, y] = stagePos(sl); FX.burst(x, y, ['#fff', '#ffd15c'], 5, 90); } } if (!PROG.d.revealSeen) { PROG.d.revealSeen = true; PROG.save(); toast('Món phía sau đã lộ ra!'); } break; }
      case 'lockTick': { const el = shelfEl(...ev.key.split(',').map(Number)); if (el) { const b = el.querySelector('.lock b'); if (b) b.textContent = ev.left; } break; }
      case 'crateToBelt': await animCrateToBelt(ev); break;
      case 'crateViaGate': await animCrateViaGate(ev); break;
      case 'suck': await animSuck(ev); break;
      case 'reqFilled': applyReqFilled(ev); break;
      case 'orderDone': await animOrderDone(ev); break;

      case 'extraSlot': G.V.extra = true; G.V.slots = ev.oi + 1; G.V.orders[ev.oi] = ev.order ? { id: ev.order.id, reqs: ev.order.reqs, filled: ev.order.reqs.map(() => false) } : null; renderOrders(); { const t = ticketEl(ev.oi); if (t) t.classList.add('enter'); } AU.sfx.unlock(); await wait(350); break;

}

function crateAtGate(crate) {

async function flyCrate(cr, start, targetFn, ms, arc = 60) {

}
async function animCrateToBelt(ev) {

function reqEl(orderId, j) { const t = $('orders').querySelector(`.ticket[data-oid="${orderId}"]`); return t ? t.querySelectorAll('.req')[j] : null; }
function reqPos(orderId, j) { const el = reqEl(orderId, j); if (!el) return [195, 120 - BELT_TOP]; const [x, y] = stagePos(el); return [x, y - BELT_TOP]; }

}
async function animSuck(ev) {

function maybeAuto() {

  G.auto = true; G.speed = 1.5; G.inputLock = true; show('autoBanner'); $('stage').classList.add('autofx'); AU.sfx.unlock(); toast('Còn 2 đơn cuối — tự động hoàn thành ×1.5');

    const steps = [];
    for (let i = 0; i < 24 && G.S.status === 'play'; i++) { const ev = Core.autoStep(G.S); if (!ev) break; steps.push(ev); }
    await wait(120);
    renderShelves();

  g.querySelectorAll('.lv').forEach(b => b.addEventListener('click', () => { AU.unlock(); AU.sfx.click(); startLevel(+b.dataset.i); }));
}
$('btnPlay').addEventListener('click', () => { AU.unlock(); AU.sfx.click(); startLevel(0); });
$('btnLevels').addEventListener('click', () => { AU.unlock(); AU.sfx.click(); showLevels(); });
$('btnBackTitle').addEventListener('click', () => { AU.sfx.click(); showTitle(); });
$('btnSettings').addEventListener('click', () => { AU.unlock(); AU.sfx.click(); const ov = overlay(`<h2>Cài đặt</h2>${togglesHtml()}<button class="bigbtn sec" id="mReset">Xóa tiến trình</button><button class="bigbtn" id="mClose">Đóng</button>`); bindToggles(ov); ov.querySelector('#mClose').addEventListener('click', () => { AU.sfx.click(); clearOverlays(); }); ov.querySelector('#mReset').addEventListener('click', () => { PROG.d.unlocked = 1; PROG.d.stars = {}; PROG.d.coins = 0; PROG.d.tutDone = false; PROG.save(); clearOverlays(); showTitle(); toast('Đã xóa tiến trình'); }); });

// ---------------- tutorial ----------------
let tutTimer = null;
function tutorialStep() {
  const tut = $('tut'), hand = $('tutHand'), box = $('tutBox');
  show('tut');
  if (G.tutStep === 1) {
    // tìm nước đi hoàn thành bộ 3
    const S = G.S; let mv = null;
    outer: for (const m of Core.moves(S)) { const d = S.grid[m.to[0]][m.to[1]]; if (d.filter(x => x === m.t).length === 2) { mv = m; break outer; } }
    let pair = false;
    if (!mv) { for (const m of Core.moves(S)) { const d = S.grid[m.to[0]][m.to[1]]; if (d.filter(x => x === m.t).length === 1) { mv = m; pair = true; break; } } }
    if (!mv) { G.tutStep = 2; return tutorialStep(); }
    const src = slotEl(...mv.from), dst = slotEl(...mv.to);
    src.querySelector('.item').classList.add('pulse'); dst.classList.add('target');
    box.innerHTML = pair ? `Kéo <b>${NAME[mv.t]}</b> sang tầng có món giống nó. Gom đủ <b>3 món giống nhau</b> trên một tầng là đóng được thùng.` : `Kéo <b>${NAME[mv.t]}</b> sang ô trống để xếp <b>3 món giống nhau</b> trên một tầng kệ.`; box.style.top = '246px'; show('tutBox'); show('tutHand');
    const [sx, sy] = stagePos(src), [dx, dy] = stagePos(dst);
    let t0 = performance.now();
    clearInterval(tutTimer);
    tutTimer = setInterval(() => { const p = ((performance.now() - t0) / 1400) % 1; const q = easeInOut(Math.min(1, p * 1.3)); hand.style.transform = `translate(${sx + (dx - sx) * q}px, ${sy + (dy - sy) * q}px) scale(${p < .1 || p > .9 ? 1 : .9})`; }, 16);
    G.tutStep = 2;
  } else if (G.tutStep === 2) {
    clearInterval(tutTimer); hide('tutHand');
    box.innerHTML = `Hộp được đóng lại và đưa lên <b>băng chuyền</b>. Khớp <b>thùng đơn hàng</b> đang cần loại đó thì được hút vào thùng!<span class="tap">Chạm để tiếp tục</span>`; box.style.top = '246px'; show('tutBox');
    box.onclick = () => { box.onclick = null; hide('tutBox'); G.tutStep = 3; PROG.d.tutDone = true; PROG.save(); };
  } else if (G.tutStep === 3) {
    box.innerHTML = `Thùng <b>chưa đơn nào cần</b> sẽ chạy vòng chờ trên băng. Băng chứa tối đa <b>${G.S.cap} thùng</b> — đầy là thua! Hãy đóng đúng loại các đơn đang mở.<span class="tap">Chạm để tiếp tục</span>`; box.style.top = '246px'; show('tutBox');
    box.onclick = () => { box.onclick = null; hide('tutBox'); hide('tut'); G.tutStep = 0; PROG.d.tutDone = true; PROG.save(); };
  }
}
// ---------------- boot ----------------
window.SortShip = { get state() { return G.S; }, get view() { return G.V; }, startLevel, get busy() { return G.busy; }, LEVELS, PROG };
showTitle();
})();

</script>
