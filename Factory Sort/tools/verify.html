<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Sort — Kiểm tra logic</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
         margin: 0; padding: 24px; background: #fbfbfa; color: #1c1c1a; }
  @media (prefers-color-scheme: dark) { body { background: #1a1a18; color: #e8e6e1; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 8px; }
  .sub { opacity: .65; margin: 0 0 20px; }
  button { font: inherit; padding: 8px 18px; border-radius: 7px; cursor: pointer;
           border: 1px solid #c9c6bd; background: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  @media (prefers-color-scheme: dark) { button { background: #2a2a27; border-color: #45443f; color: inherit; } }
  .verdict { font-weight: 600; padding: 10px 14px; border-radius: 8px; margin: 10px 0; }
  .pass { background: #e3f4e6; color: #14532d; }
  .fail { background: #fde8e6; color: #7f1d1d; }
  @media (prefers-color-scheme: dark) {
    .pass { background: #14301c; color: #a7e8bb; }
    .fail { background: #3a1613; color: #f5b3ac; }
  }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  .scroll { overflow-x: auto; }
  th, td { padding: 4px 10px; text-align: right; border-bottom: 1px solid #e6e3dc; white-space: nowrap; }
  @media (prefers-color-scheme: dark) { th, td { border-color: #34332e; } }
  th:first-child, td:first-child, td.t { text-align: left; }
  .ramp { opacity: .62; }
  .sh { font-weight: 600; }
  pre { background: #f2f0ea; padding: 10px 12px; border-radius: 7px; overflow-x: auto; font-size: 12px; }
  @media (prefers-color-scheme: dark) { pre { background: #23231f; } }
  .bar { display: inline-block; height: 9px; border-radius: 3px; background: #8b8577; vertical-align: middle; }
  .bar.sh { background: #b0523f; }
</style>
</head>
<body>
<h1>Factory Sort — Kiểm tra logic</h1>
<p class="sub">Chạy trên <code>bundle.js</code> (bản build hiện tại). Chạy <code>node tools/build.mjs</code> trước nếu vừa sửa <code>src/</code>.</p>
<button id="run">Chạy kiểm tra</button>
<div id="out"></div>

<script src="../bundle.js"></script>
<script>
/*
 * Bo kiem tra logic man choi CHAY TRONG TRINH DUYET, tren dung ban bundle.js ma ban
 * standalone dung. Node selftest da phu het phan thuat toan; gia tri rieng cua trang
 * nay la chung minh bundle chay duoc trong moi truong that.
 *
 * Ba phan:
 *   1. LUAT SPAWN  — moi Thung >= 1 vat, khong Thung wrapped san, tong o trong == 3E,
 *                    bo cuc cot toan ven.
 *   2. CHOI THAT   — chay loi giai tham chieu qua DUNG API ma UI goi (selectSource /
 *                    selectTarget), voi day du hang cho 5 slot va gioi han nuoc di.
 *   3. DUONG CONG  — bang do kho L1..L50: so Thung bi che, cua so Khay, par, diem.
 *
 * Khong dung thu vien ngoai; moi ten (configForLevelNumber, generateLevel, GameEngine,
 * LevelGenerator) den tu bundle.js — bundle la script co dien nen chia chung pham vi.
 */

const RULE_SEEDS = 10;   // seed moi level cho phan 1
const PLAY_SEEDS = 4;    // seed moi level cho phan 2
const LEVELS = [1, 3, 5, 8, 10, 13, 16, 20, 21, 25, 27, 29, 33, 35, 39, 45, 49, 50];

/* --- 1. Luat spawn --- */
function auditRules() {
  const bad = [];
  let checked = 0, minLen = Infinity;
  const shapes = {};
  for (const L of LEVELS) for (let s = 0; s < RULE_SEEDS; s++) {
    const cfg = configForLevelNumber(L, { seed: (L * 7919 + s * 104729) % 2147483647 });
    let lv;
    try { lv = generateLevel(cfg); }
    catch (e) { bad.push(`L${L} seed${s}: sinh man loi — ${e.message}`); continue; }
    checked++;

    for (const b of lv.boxes) {
      minLen = Math.min(minLen, b.items.length);
      if (b.items.length === 0) bad.push(`L${L} seed${s}: ${b.id} RONG luc spawn`);
      if (b.items.length === 3 && new Set(b.items).size === 1)
        bad.push(`L${L} seed${s}: ${b.id} da wrapped san`);
    }

    // HE QUA (1): tong o trong = 3 * carrierBoxes, bat ke ban to co nao.
    const free = lv.boxes.reduce((a, b) => a + (3 - b.items.length), 0);
    if (free !== 3 * lv.config.carrierBoxes)
      bad.push(`L${L} seed${s}: ${free} o trong, phai la ${3 * lv.config.carrierBoxes}`);

    // Bo cuc cot phai toan ven.
    const lay = lv.layout;
    if (!lay) { bad.push(`L${L} seed${s}: thieu layout`); continue; }
    const flat = lay.columns.flat();
    if (flat.length !== lv.boxes.length)
      bad.push(`L${L} seed${s}: cot chua ${flat.length} Thung, ban co ${lv.boxes.length}`);
    if (new Set(flat).size !== flat.length)
      bad.push(`L${L} seed${s}: mot Thung nam o hai cot`);
    if (lay.hiddenBoxes !== Math.max(0, lv.config.numBoxes - lay.columns.length * lay.visibleRows))
      bad.push(`L${L} seed${s}: hiddenBoxes khong khop bo cuc`);

    // O trong phai co it nhat mot o nam trong tam voi, neu khong nguoi choi ket ngay.
    const visIdx = new Set(lay.columns.flatMap(c => c.slice(0, lay.visibleRows)));
    const visFree = [...visIdx].reduce((a, i) => a + (3 - lv.boxes[i].items.length), 0);
    if (visFree === 0) bad.push(`L${L} seed${s}: khong o trong nao trong tam voi luc spawn`);

    if (lv.conveyor.maxActive > lv.trays.length)
      bad.push(`L${L} seed${s}: cua so > so Khay`);
    if (lv.solvable !== true) bad.push(`L${L} seed${s}: khong co bang chung giai duoc`);

    const key = `${lay.hiddenBoxes} Thung bi che / ${visFree} o trong hien`;
    shapes[key] = (shapes[key] || 0) + 1;
  }
  return { checked, bad, minLen, shapes };
}

/* --- 2. Choi that qua engine --- */
function playthrough() {
  const bad = [];
  let passed = 0, total = 0, maxQueue = 0;
  for (const L of LEVELS) for (let s = 0; s < PLAY_SEEDS; s++) {
    const cfg = configForLevelNumber(L, { seed: (L * 31337 + s * 15485863) % 2147483647 });
    let lv;
    try { lv = generateLevel(cfg); }
    catch (e) { bad.push(`L${L} seed${s}: sinh man loi — ${e.message}`); continue; }
    total++;

    const eng = new GameEngine();
    eng.startLevel(LevelGenerator.toEngineLevel(lv));
    if (eng.boxes.some(b => b.items.length === 0)) { bad.push(`L${L} seed${s}: engine thay Thung rong`); continue; }

    // Dung DUNG hai API ma UI goi. Khong noi long hang cho, khong tat moveLimit:
    // par la so toi uu that su nen loi giai tham chieu phai vua khit moi rang buoc.
    let broke = null;
    for (const mv of lv.referenceSolution) {
      if (!eng.selectSource(mv.from, mv.index)) { broke = `engine tu choi nhac item o Thung ${mv.from}`; break; }
      if (!eng.selectTarget(mv.to)) { broke = `engine tu choi tha item vao Thung ${mv.to}`; break; }
      maxQueue = Math.max(maxQueue, eng.queue.length);
      if (eng.gameState === 'LOST') { broke = `THUA giua chung — ${eng.loseReason}`; break; }
    }
    if (broke) { bad.push(`L${L} seed${s}: ${broke}`); continue; }
    if (eng.gameState !== 'WON')
      bad.push(`L${L} seed${s}: ket thuc o ${eng.gameState}, con ${eng.conveyor.allTrays.length} Khay`);
    else if (eng.moveCount > (lv.rules.moveLimit ?? Infinity))
      bad.push(`L${L} seed${s}: ton ${eng.moveCount} nuoc > gioi han ${lv.rules.moveLimit}`);
    else passed++;
  }
  return { passed, total, bad, maxQueue };
}

/* --- 3. Duong cong do kho (dung seed chinh thuc cua tung man) --- */
function curve() {
  const rows = [];
  for (let L = 1; L <= 50; L++) {
    const cfg = configForLevelNumber(L);
    let lv; try { lv = generateLevel(cfg); } catch (e) { continue; }
    const d = lv.difficulty;
    rows.push({
      L, tier: cfg.tier, boxes: cfg.numBoxes, hidden: d.hiddenBoxes, trays: cfg.numSets,
      act: cfg.conveyorMaxActive, pool: `${cfg.numCategories}x${cfg.itemTypesPerCategory}`,
      E: cfg.carrierBoxes, open: d.openingSets, par: d.parMoves,
      lim: lv.rules.moveLimit ?? '—', score: d.score,
    });
  }
  return rows;
}

function verdict(ok, text) {
  return `<div class="verdict ${ok ? 'pass' : 'fail'}">${ok ? 'DAT' : 'HONG'} — ${text}</div>`;
}

document.getElementById('run').addEventListener('click', () => {
  const btn = document.getElementById('run');
  const out = document.getElementById('out');
  btn.disabled = true;
  out.innerHTML = '<p>Đang chạy…</p>';

  setTimeout(() => {
    const t0 = performance.now();
    const r1 = auditRules();
    const r2 = playthrough();
    const r3 = curve();
    const ms = Math.round(performance.now() - t0);

    // Hinh dang duong cong: hop dong voi nguoi choi, khong phai chi tiet noi bo.
    const issues = [];
    if (r3.length !== 50) issues.push(`chi sinh duoc ${r3.length}/50 man`);
    for (const r of r3) {
      const want = r.L <= 5 ? 'tutorial' : r.L <= 10 ? 'onboarding' : r.L <= 20 ? 'acclimation'
                 : r.L % 10 === 9 ? 'superhard' : r.L % 10 === 5 ? 'hard' : 'normal';
      if (r.tier !== want) issues.push(`L${r.L} la ${r.tier}, mong doi ${want}`);
      if (r.tier === 'hard' && (r.boxes < 50 || r.boxes > 70))
        issues.push(`L${r.L} (hard) co ${r.boxes} Thung, hop dong la 50-70`);
      if (r.tier === 'superhard' && (r.boxes < 72 || r.boxes > 96))
        issues.push(`L${r.L} (superhard) co ${r.boxes} Thung, hop dong la 72-96`);
      if (r.lim !== '—' && r.lim < r.par) issues.push(`L${r.L}: gioi han ${r.lim} < par ${r.par}`);
    }
    const lo = (t) => Math.min(...r3.filter(r => r.tier === t).map(r => r.score));
    const hi = (t) => Math.max(...r3.filter(r => r.tier === t).map(r => r.score));
    for (const [a, b] of [['tutorial', 'onboarding'], ['onboarding', 'acclimation'],
                          ['acclimation', 'normal'], ['normal', 'hard'], ['hard', 'superhard']]) {
      if (lo(b) <= hi(a)) issues.push(`diem: tier '${b}' (tu ${lo(b)}) khong cao hon '${a}' (den ${hi(a)})`);
    }

    const max = Math.max(...r3.map(r => r.score));
    const table = `<div class="scroll"><table>
      <tr><th>Level</th><th class="t">Bậc</th><th>Thùng</th><th>Bị che</th><th>Khay</th><th>Cửa sổ</th>
          <th>Pool</th><th>E</th><th>Mở đầu</th><th>Par</th><th>Giới hạn</th><th>Điểm</th><th class="t"></th></tr>
      ${r3.map(r => `<tr class="${r.tier === 'tutorial' || r.tier === 'onboarding' ? 'ramp' : r.tier === 'superhard' ? 'sh' : ''}">
        <td>${r.L}</td><td class="t">${r.tier}</td><td>${r.boxes}</td><td>${r.hidden}</td><td>${r.trays}</td>
        <td>${r.act}</td><td>${r.pool}</td><td>${r.E}</td><td>${r.open}</td>
        <td>${r.par}</td><td>${r.lim}</td><td>${r.score}</td>
        <td class="t"><span class="bar ${r.tier === 'superhard' ? 'sh' : ''}" style="width:${(r.score / max * 130).toFixed(0)}px"></span></td>
      </tr>`).join('')}
    </table></div>`;

    out.innerHTML = `
      <h2>1. Luật spawn — ${r1.checked} màn</h2>
      ${verdict(r1.bad.length === 0 && r1.minLen >= 1,
        r1.bad.length === 0
          ? `mọi Thùng đều có ≥1 vật, không Thùng nào wrapped sẵn, tổng ô trống đúng bằng 3E, bố cục cột toàn vẹn`
          : `${r1.bad.length} vi phạm`)}
      ${r1.bad.length ? `<pre>${r1.bad.slice(0, 15).join('\n')}</pre>` : ''}
      <p>Thùng ít vật nhất trên toàn bộ mẫu: <b>${r1.minLen}</b> vật. Hình dạng bàn gặp phải:</p>
      <pre>${Object.entries(r1.shapes).sort().map(([k, v]) => `${k.padEnd(38)} ${v} màn`).join('\n')}</pre>

      <h2>2. Chơi thật qua engine — ${r2.total} màn</h2>
      ${verdict(r2.bad.length === 0,
        r2.bad.length === 0
          ? `${r2.passed}/${r2.total} màn thắng qua GameEngine thật, với đủ hàng chờ 5 slot và giới hạn nước đi`
          : `${r2.bad.length} màn không hoàn thành`)}
      ${r2.bad.length ? `<pre>${r2.bad.slice(0, 15).join('\n')}</pre>` : ''}
      <p>Hàng chờ sâu nhất gặp phải khi chạy lời giải tối ưu: <b>${r2.maxQueue}</b>/5.</p>

      <h2>3. Đường cong độ khó — 50 màn chính thức</h2>
      ${verdict(issues.length === 0,
        issues.length === 0
          ? `định tuyến tier đúng, hard 50-70 Thùng / super hard 72-96, giới hạn nước đi ≥ par, điểm tăng dần theo tier`
          : `${issues.length} vấn đề`)}
      ${issues.length ? `<pre>${issues.join('\n')}</pre>` : ''}
      ${table}
      <p class="sub">Chạy hết trong ${ms} ms.</p>`;
    btn.disabled = false;
  }, 30);
});
</script>
</body>
</html>
