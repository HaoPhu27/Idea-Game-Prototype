<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Factory Sort - Prototype v1</title>
    <link rel="stylesheet" href="style.css">

<script>
window.addEventListener('error', function(e) {
    var err = document.createElement('div');
    err.style = 'position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;font-size:20px;';
    err.textContent = 'ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
    document.body.appendChild(err);
});
window.addEventListener('unhandledrejection', function(e) {
    var err = document.createElement('div');
    err.style = 'position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;font-size:20px;';
    err.textContent = 'PROMISE REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    document.body.appendChild(err);
});
</script>
</head>

<body>
    <div id="game-container">
        <header id="game-header">
            <div class="level-info">Level: <span id="level-display">Random</span></div>
            <div class="move-info">Moves: <span id="move-display">0</span><span id="move-limit"></span></div>
            <button id="btn-select-level" class="btn">Levels</button>
            <button id="btn-new-game" class="btn">New Game</button>
        </header>

        <main id="play-area">
            <!-- Box area occupies top -->
            <section id="boxes-area">
                <div id="boxes-grid"></div>
            </section>
            
            <!-- Tray area occupies bottom (conveyor belt with nested queue deck) -->
            <section id="tray-area">
                <div id="conveyor-belt">
                    <div class="port-in">IN ⬇</div>
                    <div class="port-out">⬅ OUT</div>
                </div>

                <!-- Waiting queue area (5 slots) nestled INSIDE conveyor -->
                <section id="queue-area">
                    <div class="queue-header">
                        <div class="queue-hazard-strip"></div>
                        <span id="queue-counter" class="queue-counter">0/5</span>
                    </div>
                    <div id="queue-slots" class="queue-slots">
                        <div class="queue-slot" data-slot="0"></div>
                        <div class="queue-slot" data-slot="1"></div>
                        <div class="queue-slot" data-slot="2"></div>
                        <div class="queue-slot" data-slot="3"></div>
                        <div class="queue-slot" data-slot="4"></div>
                    </div>
                </section>

                <div id="trays-container"></div>
            </section>
        </main>
        
        <!-- Ghost element for dragging wrapped boxes -->
        <div id="drag-ghost" style="display: none;"></div>

        <!-- Overlays -->
        <div id="overlay-win" class="overlay hidden">
            <div class="overlay-content">
                <h2>Level Complete!</h2>
                <p>All items delivered successfully.</p>
                <button id="btn-next-level" class="btn primary">Next Level</button>
            </div>
        </div>
        
        <div id="overlay-lose" class="overlay hidden">
            <div class="overlay-content">
                <h2>Out of Space!</h2>
                <p id="lose-reason">No more empty slots to move items.</p>
                <button id="btn-retry" class="btn primary">Try Again</button>
            </div>
        </div>
        
        <div id="overlay-loading" class="overlay hidden">
            <div class="overlay-content transparent loading-bg">
                <h2>Generating level...</h2>
            </div>
        </div>

        <div id="overlay-level-select" class="overlay hidden">
            <div class="overlay-content level-select-modal">
                <h2>Select Level</h2>
                <div id="level-grid" class="level-grid"></div>
                <button id="btn-close-level-select" class="btn primary" style="margin-top: 15px;">Close</button>
            </div>
        </div>
    </div>

    <!-- Scripts using ES modules -->
    <script type="module" src="src/ui/UIManager.js"></script>
</body>
</html>
